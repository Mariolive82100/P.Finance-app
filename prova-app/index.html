<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>P.Finance PROVA</title>
<script>window.PF_PROVA = true;</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
<style>
#splash{position:fixed;inset:0;z-index:99999;background:#f1f5f4;display:flex;align-items:center;justify-content:center;flex-direction:column;animation:spOut .5s ease 2.9s forwards}
#splash .e{position:absolute;font:700 120px/1 system-ui,-apple-system,Segoe UI,sans-serif;color:#0f766e;opacity:0;animation:spEur 1.5s ease-in forwards}
#splash .p{width:104px;height:104px;border-radius:26px;background:#0f766e;color:#fff;display:flex;align-items:center;justify-content:center;font:800 68px/1 system-ui,-apple-system,Segoe UI,sans-serif;opacity:0;box-shadow:0 12px 34px rgba(15,118,110,.35);animation:spP .7s cubic-bezier(.2,.9,.3,1.2) 1.4s forwards}
#splash .n{margin-top:18px;font:700 22px system-ui,-apple-system,Segoe UI,sans-serif;color:#0f3f3a;letter-spacing:.5px;opacity:0;animation:spN .5s ease 1.9s forwards}
@keyframes spEur{0%{transform:scale(.35);opacity:0}25%{opacity:1}65%{opacity:1}100%{transform:scale(2.6);opacity:0}}
@keyframes spP{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes spN{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash{display:none}}
</style>
<script>
/* tasto Installa: il browser avvisa quando l'app è installabile */
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.PF_INST = e; window.dispatchEvent(new Event('pf-inst')); });
window.addEventListener('appinstalled', function () { window.PF_INST = null; window.dispatchEvent(new Event('pf-inst')); });
</script>
</head>
<body>
<div id="splash" aria-hidden="true"><div class="e">€</div><div class="p">P</div><div class="n">P.Finance</div></div>
<script>try{if(sessionStorage.getItem('pf_splash')){document.getElementById('splash').remove()}else{sessionStorage.setItem('pf_splash','1');setTimeout(function(){var s=document.getElementById('splash');if(s)s.remove()},3500)}}catch(e){setTimeout(function(){var s=document.getElementById('splash');if(s)s.remove()},3500)}</script>
<div id="app"></div>
<script async src="https://accounts.google.com/gsi/client"></script>
<script defer src="drive-archivio.js"></script>
<script defer src="base.js"></script>
<script defer src="pagine.js"></script>
<script defer src="grafici.js"></script>
<script defer src="albero.js"></script>
<script defer src="report-pdf.js"></script>
<script defer src="azioni.js"></script>
<script defer src="drive-inizio.js"></script>
<script defer src="drive-app.js"></script>
</body>
</html>
