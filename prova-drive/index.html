<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prova Drive">
<title>Prova Drive</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f4;color:#12302c;font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:21px;margin:4px 0}h2{font-size:16px;margin:0 0 8px}
.card{background:#fff;border-radius:14px;padding:14px;margin-top:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
button,.file{display:block;width:100%;margin-top:8px;padding:12px;border:0;border-radius:10px;background:#0f766e;color:#fff;font-family:inherit;font-size:16px;font-weight:600;text-align:center;cursor:pointer}
button.s,.file{background:#e2eeec;color:#0f3f3a}
button.r{background:#fdecec;color:#a11}
button:disabled{opacity:.45}
input[type=text]{width:100%;padding:11px;border:1px solid #c5d6d3;border-radius:10px;font-size:15px}
table{width:100%;border-collapse:collapse}td{padding:7px 0;border-bottom:1px solid #e5eeec}td+td{text-align:right}
#stato{font-weight:700}.m{font-size:13px;color:#527069;margin:6px 0 0}
#msg{margin-top:12px;padding:11px;border-radius:10px;background:#fff6d8;display:none}
#diario{white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace;max-height:220px;overflow:auto;margin:0}
details summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<main>
<h1>Prova Drive</h1>
<p class="m">Solo dati inventati. Non tocca P.Finance né i tuoi dati veri.</p>
<div id="msg" role="status"></div>

<section class="card">
<details id="conf"><summary>Configurazione (una volta per dispositivo)</summary>
<p class="m">Incolla l'ID client di Google.</p>
<input type="text" id="cid" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="…apps.googleusercontent.com">
<button class="s" id="salvaCid">Salva ID</button>
</details>
</section>

<section class="card">
<div id="stato">Non collegato</div>
<p class="m" id="scad"></p>
<button id="collega">Accedi con Google</button>
<button class="s" id="scollega">Scollega</button>
<button class="s" id="scaduto">Simula accesso scaduto</button>
</section>

<section class="card">
<h2>Dati di prova</h2>
<table id="tab"></table>
<p class="m" id="info"></p>
<button id="modifica">Modifica un saldo e salva</button>
<button class="s" id="ricarica">Rileggi da Drive</button>
</section>

<section class="card">
<h2>Copia di sicurezza</h2>
<button class="s" id="scarica">Scarica copia</button>
<label class="file">Ripristina da copia<input type="file" id="file" accept=".json,application/json" hidden></label>
<button class="r" id="elimina">Elimina i dati di prova da Drive</button>
</section>

<section class="card">
<h2>Diario della prova</h2>
<pre id="diario"></pre>
<button class="s" id="copia">Copia diario</button>
</section>
</main>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="prova.js?v=2"></script>
</body>
</html>
