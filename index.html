<body>
<div id="app"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc, collection, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA6D6lvqErC4rXALCu9Tp_4_iI6fwjjR5k",
  authDomain: "p-finance-app.firebaseapp.com",
  projectId: "p-finance-app",
  storageBucket: "p-finance-app.firebasestorage.app",
  messagingSenderId: "157182448469",
  appId: "1:157182448469:web:bf091bf38a027e004115dc"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const VER = '0.41';
const ADMIN_EMAIL = 'mariot@pfinance.app';
const CATS = {
  attivo: ['Liquidità', 'Investimenti', 'Immobili', 'Beni', 'Altro'],
  passivo: ['Mutuo', 'Prestito', 'Carta di credito', 'Altro debito']
};
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mailOf = n => n.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '') + '@pfinance.app';
const eur = v => new Intl.NumberFormat('it-IT', {style:'currency', currency:'EUR', maximumFractionDigits: 0, useGrouping:'always'}).format(v || 0);
const pct = v => (v >= 0 ? '+' : '') + (v * 100).toFixed(1).replace('.', ',') + '%';
const monthKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
const monthName = k => { const [y, m] = k.split('-'); return MESI[+m - 1] + ' ' + y; };
const totals = voci => {
  const a = voci.filter(v => v.tipo === 'attivo').reduce((s, v) => s + v.valore, 0);
  const p = voci.filter(v => v.tipo === 'passivo').reduce((s, v) => s + v.valore, 0);
  return { attivi: a, passivi: p, netto: a - p };
};
const cls = v => v >= 0 ? 'pos' : 'neg';
const pnum = s => parseFloat(String(s).replace(/\./g, '').replace(',', '.'));
const r2 = v => Math.round(v * 100) / 100;
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtD = s => s.split('-').reverse().join('/');
const addM = (d, k) => { const x = new Date(d.getFullYear(), d.getMonth() + k, 1); const last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate(); x.setDate(Math.min(d.getDate(), last)); return x; };
const cnt = (a, b) => { let k = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()); while (k > 0 && addM(a, k) > b) k--; while (addM(a, k + 1) <= b) k++; return Math.max(0, k); };
/* Piano di rimborso: solo quota capitale, rate mensili uguali dalla data di inizio alla data di fine */
function piano(v, oggi = new Date()) {
  const a = parseD(v.inizio), f = parseD(v.fine), t = new Date(oggi.getFullYear(), oggi.getMonth(), oggi.getDate());
  const N = Math.max(1, cnt(a, f)), rata = r2(v.capitale / N);
  if (t < a) return { N, k: 0, rata, residuo: 0, partito: false };
  const k = Math.min(N, cnt(a, t));
  return { N, k, rata, residuo: r2(v.capitale * (N - k) / N), partito: true };
}
const applyPiano = v => { if (v.piano) v.valore = piano(v).residuo; return v; };
const RENAME = { 'Conto corrente': 'Liquidità', 'Immobile': 'Immobili', 'Altro attivo': 'Altro' };
/* Porta i vecchi dati alle nuove categorie: Liquidità, Investimenti, Immobili, Beni, Altro */
async function migraCategorie(uid, voci) {
  const save = async v => { const { id, ...rest } = v; await setDoc(doc(db, 'users', uid, 'voci', id), rest); };
  for (const v of [...voci]) {
    if (v.tipo !== 'attivo') continue;
    if (RENAME[v.categoria]) { v.categoria = RENAME[v.categoria]; await save(v); }
    else if (v.categoria === 'Portafoglio') {
      const c = voci.find(x => x.id === v.conto);
      v.categoria = 'Investimenti'; delete v.conto; if (c) v.dove = c.nome; await save(v);
    } else if (v.categoria === 'Conto di investimento') {
      const lq = v.liquidita !== undefined ? v.liquidita : v.valore, iv = v.investito || 0, ob = v.obiettivo;
      delete v.liquidita; delete v.investito; delete v.obiettivo;
      if (iv > 0) {
        const inv = { tipo: 'attivo', categoria: 'Investimenti', nome: v.nome, dove: v.nome, account: v.account || '', valore: iv };
        if (ob) inv.obiettivo = ob;
        if (lq > 0) { v.categoria = 'Liquidità'; v.valore = lq; await save(v); const r = await addDoc(collection(db, 'users', uid, 'voci'), inv); voci.push({ id: r.id, ...inv }); }
        else { Object.assign(v, inv); await save(v); }
      } else { v.categoria = 'Liquidità'; v.valore = lq; await save(v); }
    }
  }
}
const prevMonth = () => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); return monthKey(d); };

const S = { user: null, profile: null, data: null, tab: 'pat', users: [], edit: null, pendingName: null, loading: true, msg: '' };

function errText(e) {
  const c = e && e.code || '';
  if (c.includes('email-already-in-use')) return 'Questo nome è già registrato.';
  if (c.includes('invalid-credential') || c.includes('user-not-found') || c.includes('wrong-password')) return 'Nome o PIN errati.';
  if (c.includes('weak-password')) return 'Il PIN deve avere 6 cifre.';
  if (c.includes('network')) return 'Connessione assente. Riprova.';
  if (c.includes('too-many-requests')) return 'Troppi tentativi. Riprova tra qualche minuto.';
  if (c.includes('permission-denied')) return 'Permesso negato. Chiedi all\'amministratore.';
  return 'Errore: ' + (c || (e && e.message) || 'sconosciuto');
}

/* ---------- Dati ---------- */
async function loadData(uid, nome, readonly) {
  const [vs, ss, as] = await Promise.all([
    getDocs(collection(db, 'users', uid, 'voci')),
    getDocs(collection(db, 'users', uid, 'storico')),
    getDocs(collection(db, 'users', uid, 'account'))
  ]);
  const accounts = as.docs.map(d => ({ id: d.id, nome: d.data().nome })).sort((a, b) => a.nome.localeCompare(b.nome));
  const voci = vs.docs.map(d => ({ id: d.id, ...d.data() }));
  if (!readonly) await migraCategorie(uid, voci);
  voci.forEach(applyPiano);
  const arch = voci.filter(v => v.archiviata);
  for (let i = voci.length - 1; i >= 0; i--) if (voci[i].archiviata) voci.splice(i, 1);
  const storico = ss.docs.map(d => ({ mese: d.id, ...d.data() })).sort((a, b) => a.mese.localeCompare(b.mese));
  S.data = { uid, nome, readonly, voci, arch, storico, accounts };
  if (!readonly) await syncStorico();
}

async function syncStorico() {
  const D = S.data;
  if (!D || D.readonly) return;
  const t = totals(D.voci);
  const mk = monthKey();
  const cur = D.storico.find(x => x.mese === mk);
  if (!D.voci.length && !cur) return;
  if (cur && cur.attivi === t.attivi && cur.passivi === t.passivi) return;
  await setDoc(doc(db, 'users', D.uid, 'storico', mk), { ...t, aggiornato: serverTimestamp() });
  if (cur) Object.assign(cur, t); else { D.storico.push({ mese: mk, ...t }); D.storico.sort((a, b) => a.mese.localeCompare(b.mese)); }
}

async function loadUsers() {
  const q = await getDocs(collection(db, 'users'));
  S.users = q.docs.map(d => ({ uid: d.id, ...d.data() })).filter(u => u.uid !== S.user.uid)
    .sort((a, b) => (a.approved === b.approved ? (a.nome || '').localeCompare(b.nome || '') : a.approved ? 1 : -1));
}

/* ---------- Accesso ---------- */
onAuthStateChanged(auth, async user => {
  S.user = user; S.msg = '';
  if (!user) { S.profile = null; S.data = null; S.loading = false; return render(); }
  S.loading = true; render();
  try {
    const ref = doc(db, 'users', user.uid);
    let snap = await getDoc(ref);
    if (!snap.exists()) {
      const nome = S.pendingName || user.email.split('@')[0];
      await setDoc(ref, { nome, approved: false, creato: serverTimestamp() });
      snap = await getDoc(ref);
    }
    S.profile = snap.data();
    if (user.email === ADMIN_EMAIL && !S.profile.approved) {
      await updateDoc(ref, { approved: true });
      S.profile.approved = true;
    }
    if (S.profile.approved) {
      await loadData(user.uid, S.profile.nome, false);
      if (isAdmin()) await loadUsers();
    }
  } catch (e) { S.msg = errText(e); }
  S.loading = false; render();
});
const isAdmin = () => S.user && S.user.email === ADMIN_EMAIL;

const TERMS_V = 1;
const termsHtml = () => `<h2>Termini e condizioni</h2><p class="lbl">Versione ${TERMS_V} · P.Finance (beta)</p>
<h3>1. Cos'è questa app</h3><p>Uno strumento per tenere traccia del proprio patrimonio e per imparare i concetti di base della finanza personale. Non è consulenza finanziaria, fiscale o legale: i commenti del report sono informazioni generali a scopo educativo.</p>
<h3>2. Nessuna garanzia</h3><p>L'app è in versione di prova e può contenere errori o interruzioni. I calcoli dipendono dai dati che inserisci tu, di cui sei responsabile. Il titolare non risponde delle decisioni prese in base a ciò che l'app mostra.</p>
<h3>3. Titolare e contatti</h3><p>Il titolare è Mario T. Per qualsiasi richiesta (informazioni, correzione o cancellazione dei dati) contattalo direttamente.</p>
<h3>4. Quali dati vengono salvati</h3><p>Il nome scelto, il PIN (gestito dal servizio di accesso e non leggibile dal titolare), le voci di attivo e passivo, i sotto-account e lo storico mensile. Non vengono raccolti altri dati e non vengono venduti né ceduti a terzi.</p>
<h3>5. Chi può vedere i tuoi dati</h3><p>Ogni iscritto vede solo i propri dati. Nemmeno l'amministratore può consultarli tramite l'app. Resta un limite tecnico: i dati sono conservati sul servizio Firebase di Google e chi gestisce quel servizio potrebbe accedervi dal suo pannello di controllo. Il titolare si impegna a non farlo.</p>
<h3>6. Accesso e sicurezza</h3><p>Il PIN è personale: non condividerlo. L'accesso è soggetto ad approvazione e il titolare può sospendere un account.</p>
<h3>7. Cancellazione</h3><p>Puoi chiedere in qualsiasi momento la cancellazione del tuo account e di tutti i tuoi dati. Puoi anche scaricare i tuoi dati dalla funzione di esportazione.</p>
<h3>8. Modifiche ai termini</h3><p>Se i termini cambiano, alla successiva apertura dell'app ti verrà chiesto di accettarli di nuovo per continuare a usarla.</p>`;
function termsGate() {
  $('app').innerHTML = `<div class="auth card" style="max-width:640px">${termsHtml()}<label style="display:flex;gap:10px;align-items:flex-start;margin:14px 0"><input type="checkbox" id="tc" style="width:auto;margin-top:3px"><span>Ho letto e accetto i termini e condizioni.</span></label><div class="msg">${esc(S.msg)}</div>
    <div class="acts"><button class="b" data-act="accept">Accetto e continuo</button><button class="b s" data-act="logout">Esci</button></div></div>`;
}
function pageTerms() { return `<div class="card terms">${termsHtml()}<p class="note">Hai accettato la versione ${S.profile && S.profile.termini ? S.profile.termini : TERMS_V}.</p></div>`; }

/* ---------- Schermate ---------- */
const ORD = ['pat', 'dis', 'and', 'rep'];
function arrows() {
  const i = ORD.indexOf(S.tab); if (i < 0 || S.menu || S.pop || S.popm || S.fs) return '';
  return (i > 0 ? '<button class="pga l" data-act="pg" data-v="-1" aria-label="Pagina precedente">‹</button>' : '') + (i < ORD.length - 1 ? '<button class="pga r" data-act="pg" data-v="1" aria-label="Pagina successiva">›</button>' : '');
}
function render() {
  const el = $('app');
  if (S.loading) { el.innerHTML = '<div class="auth card">Caricamento…</div>'; return; }
  if (!S.user) return renderAuth(el);

  if (!S.profile || !S.profile.approved) {
    el.innerHTML = `<div class="auth card"><h2>Registrazione ricevuta</h2>

    return;
  }
  const D = S.data;
  const tabs = [['pat', 'Patrimonio'], ['dis', 'Distribuzione'], ['and', 'Andamento'], ['rep', 'Report del mese']];
  const pend = isAdmin() && !D.readonly ? S.users.filter(u => !u.approved).length : 0;
  if (S.tab === 'adm' && !(isAdmin() && !D.readonly)) S.tab = 'pat';
  let body = '';
  if (S.tab === 'pat') body = pagePat(); else if (S.tab === 'dis') body = pageDis(); else if (S.tab === 'and') body = pageAnd(); else if (S.tab === 'rep') body = pageRep(); else if (S.tab === 'terms') body = pageTerms(); else body = pageAdm();
  el.innerHTML = `<header><div class="hw"><button class="ham" data-act="menu" aria-label="Menu">☰${pend ? '<i class="dot"></i>' : ''}</button><h1>P.Finance <span class="ver">v${VER} beta</span></h1><span class="un">${esc(S.profile.nome)}</span>
    <button class="b s sm" data-act="share">Condividi</button><button class="b s sm" data-act="logout">Esci</button></div>
    <nav>${tabs.map(([k, l]) => `<button data-act="tab" data-v="${k}" class="${S.tab === k ? 'on' : ''}">${l}</button>`).join('')}</nav></header>
    <main>${D.readonly ? `<div class="banner"><span>Stai vedendo i dati di <b>${esc(D.nome)}</b> (sola lettura)</span><button class="b sm" data-act="back">Torna ai miei</button></div>` : ''}
    <div class="msg ${/salvato\.$|aggiunto\.$|aggiornato\.$|^Link copiato/.test(S.msg) ? 'ok' : ''}">${esc(S.msg)}</div>${body}</main>${S.menu ? drawer() : ''}${S.pop ? popup() : ''}${S.popm ? popupM() : ''}${S.fs ? fsOverlay() : ''}${arrows()}`;
  const hd = document.querySelector('header'); if (hd) document.documentElement.style.setProperty('--hh', hd.offsetHeight + 'px');

}

/* ---------- Gesto/tasto "indietro" ---------- */
let navLast = null;
const navKey = () => S.tab + '|' + (S.menu ? 'm' : S.pop ? 'p' : S.popm ? 'q' : S.fs ? 'f' : '');
function navSync() {
  const k = navKey();
  if (navLast === null) { history.replaceState({ k }, ''); navLast = k; return; }
  if (k === navLast) return;
  const [t0, o0] = navLast.split('|'), [t1, o1] = k.split('|');
  navLast = k;
  if (o0 && !o1 && t0 === t1) history.back(); else history.pushState({ k }, '');
}
window.addEventListener('popstate', e => {
  if (!S.user || !S.profile || !S.profile.approved || !e.state || !e.state.k) return;
  const t = e.state.k.split('|')[0], changed = t !== S.tab;
  S.tab = t; S.menu = false; S.pop = null; S.popm = null; S.fs = null; S.addAcc = false;
  navLast = t + '|';
  render(); if (changed) window.scrollTo(0, 0);
});

const accKey = v => v.account || 'main';

function pagePat() {
  const D = S.data, fa = S.fAcc || 'all', ed = S.edit && D.voci.find(v => v.id === S.edit);
  const vis = D.voci.filter(v => fa === 'all' || accKey(v) === fa), t = totals(vis);
  const g = (id, d) => (S.fd && S.fd[id] !== undefined) ? S.fd[id] : d;
  const tipo = g('ft', ed ? ed.tipo : 'attivo');
  const mod = tipo === 'passivo' ? g('fm', ed ? (ed.piano ? 'piano' : 'manuale') : 'piano') : 'manuale';
  const cat = g('fc', ed ? ed.categoria : CATS[tipo][0]);
  const isInv = tipo === 'attivo' && cat === 'Investimenti';
  const accOpts = [['main', D.nome], ...D.accounts.map(a => [a.id, a.nome])];
  const clk = id => D.readonly ? '' : ` data-act="pop" data-v="${id}"`;
  const rcl = D.readonly ? '' : ' cl';
  const sumOf = arr => arr.reduce((s, v) => s + v.valore, 0);
  const sm = (v, showCat) => {
    const a = [];
    if (showCat) a.push(esc(v.categoria));
    if (v.piano) a.push(`${eur(piano(v).rata)}/mese`, `fino al ${fmtD(v.fine)}`);
    if (v.obiettivo) a.push(`obiettivo ${eur(v.obiettivo)} (${Math.round(v.valore / v.obiettivo * 100)}%)`);
    if (D.accounts.length) a.push(esc(accName(v)));
    return a.join(' · ');
  };
  const rowHtml = (v, tp, showCat) => { const s = sm(v, showCat); return `<div class="row${rcl}"${clk(v.id)}><div class="n">${esc(v.nome)}${s ? `<small>${s}</small>` : ''}</div><div class="v${tp === 'passivo' ? ' neg' : ''}">${eur(v.valore)}</div></div>`; };
  const attivi = vis.filter(v => v.tipo === 'attivo');
  const catList = [...CATS.attivo, ...new Set(attivi.map(v => v.categoria).filter(c => !CATS.attivo.includes(c)))];
  const secs = catList.map(c => ({ c, items: attivi.filter(v => v.categoria === c) })).filter(s => s.items.length);
  const listAttivi = () => {
    if (!secs.length) return '<p class="note">Nessuna voce.</p>';
    return secs.map(s => {
      const key = 'cat:' + s.c, open = S.exp && S.exp[key], n = s.items.length;
      let inner = '';
      if (open) {
        if (s.c === 'Investimenti') {
          const grp = {}; s.items.forEach(v => (grp[v.dove || ''] = grp[v.dove || ''] || []).push(v));
          const keys = Object.keys(grp).sort((a, b) => a === '' ? 1 : b === '' ? -1 : sumOf(grp[b]) - sumOf(grp[a]));
          inner = keys.map(k => `<div class="gh"><span>${k ? 'su ' + esc(k) : 'Posizione non indicata'}</span><span>${eur(sumOf(grp[k]))}</span></div>` + grp[k].sort((a, b) => b.valore - a.valore).map(v => rowHtml(v, 'attivo', false)).join('')).join('');
        } else inner = [...s.items].sort((a, b) => b.valore - a.valore).map(v => rowHtml(v, 'attivo', false)).join('');
        inner = `<div class="sub">${inner}</div>`;
      }
      return `<div class="row cl cat" data-act="exp" data-v="${esc(key)}"><div class="n">${esc(s.c)}<small>${n} ${n === 1 ? 'voce' : 'voci'}</small></div><div class="v">${eur(sumOf(s.items))}</div><span class="chev ${open ? 'open' : ''}">▸︎</span></div>${inner}`;
    }).join('');
  };
  const listPassivi = () => { const it = vis.filter(v => v.tipo === 'passivo').sort((a, b) => b.valore - a.valore); return it.length ? it.map(v => rowHtml(v, 'passivo', true)).join('') : '<p class="note">Nessuna voce.</p>'; };
  const ar = (D.arch || []).slice().sort((x, y) => x.tipo.localeCompare(y.tipo) || x.nome.localeCompare(y.nome)), aop = S.exp && S.exp.arch;
  const archSec = ar.length ? `<div class="card"><div class="row cl cat" data-act="exp" data-v="arch"><div class="n">Archiviati<small>${ar.length} ${ar.length === 1 ? 'voce' : 'voci'} · non contano nei totali</small></div><span class="chev ${aop ? 'open' : ''}">▸︎</span></div>${aop ? `<div class="sub">${ar.map(v => `<div class="row${rcl}"${clk(v.id)}><div class="n">${esc(v.nome)}<small>${esc(v.tipo === 'attivo' ? 'Attivo' : 'Passivo')} · ${esc(v.categoria)}</small></div><div class="v${v.tipo === 'passivo' ? ' neg' : ''}">${eur(v.valore)}</div></div>`).join('')}</div>` : ''}</div>` : '';
  const fname = fa === 'all' ? '' : fa === 'main' ? D.nome : ((D.accounts.find(a => a.id === fa) || {}).nome || '');
  const filtro = fname ? `<div class="banner"><span>Account: <b>${esc(fname)}</b></span><button class="b sm" data-act="facc" data-v="all">Mostra tutti</button></div>` : '';
  const selAcc = D.accounts.length ? `<label class="lbl">Account</label><select id="fa">${accOpts.map(([k, n]) => `<option value="${esc(k)}" ${g('fa', ed ? accKey(ed) : (fa !== 'all' ? fa : 'main')) === k ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>` : '';
  const num = (id, dflt) => esc(g(id, dflt));
  const suggest = [...new Set(D.voci.filter(v => v.categoria === 'Liquidità').map(v => v.nome))];
  const cur = g('fw', ed && ed.dove ? ed.dove : (suggest[0] || '__new'));
  const opts = [...new Set([...suggest, ...(ed && ed.dove ? [ed.dove] : [])])];
  const invCampi = isInv ? `<label class="lbl">Conto di riferimento</label><select id="fw" data-act="fcat">${opts.map(o => `<option value="${esc(o)}" ${cur === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}<option value="__new" ${cur === '__new' || !opts.includes(cur) ? 'selected' : ''}>＋ Nuovo conto…</option></select>
    ${cur === '__new' || !opts.includes(cur) ? `<input id="fwn" maxlength="60" placeholder="Nome del nuovo conto (verrà creato anche tra la liquidità)" value="${num('fwn', '')}">` : ''}
    <label class="lbl">Obiettivo in euro (facoltativo)</label><input id="fo" inputmode="decimal" value="${num('fo', ed && ed.obiettivo ? String(ed.obiettivo).replace('.', ',') : '')}">` : '';
  const campi = mod === 'piano'
    ? `<label class="lbl">Importo preso a prestito (€)</label><input id="fk" inputmode="decimal" value="${num('fk', ed && ed.piano ? String(ed.capitale).replace('.', ',') : '')}">
    <label class="lbl">Data di inizio</label><input id="fi" type="date" value="${num('fi', ed && ed.piano ? ed.inizio : '')}">
    <label class="lbl">Data di fine</label><input id="ff" type="date" value="${num('ff', ed && ed.piano ? ed.fine : '')}">
    <p class="note" style="margin-top:0">Il debito residuo scende da solo ogni mese della sola quota capitale (importo diviso per i mesi). Gli interessi sono un costo e non vengono considerati.</p>`
    : `<label class="lbl">${tipo === 'attivo' ? 'Saldo o valore in euro' : 'Valore in euro'}</label><input id="fv" inputmode="decimal" value="${num('fv', ed && !ed.piano ? String(ed.valore).replace('.', ',') : '')}">${invCampi}`;
  const selMod = tipo === 'passivo' ? `<label class="lbl">Come vuoi inserire il debito?</label><select id="fm" data-act="fmod"><option value="piano" ${mod === 'piano' ? 'selected' : ''}>Piano di rimborso (calcolo automatico)</option><option value="manuale" ${mod === 'manuale' ? 'selected' : ''}>Residuo inserito a mano</option></select>` : '';
  const fopen = !!ed || !!(S.exp && S.exp.form);
  const form = D.readonly ? '' : `<div class="card" id="formvoce"><div class="row cl cat" data-act="exp" data-v="form" style="border:0;padding:0"><div class="n">${ed ? 'Modifica voce' : 'Aggiungi al patrimonio'}</div><span class="chev ${fopen ? 'open' : ''}">▸︎</span></div>${fopen ? `
    <label class="lbl">Tipo</label><select id="ft" data-act="ftipo"><option value="attivo" ${tipo === 'attivo' ? 'selected' : ''}>Attivo (ciò che possiedi)</option><option value="passivo" ${tipo === 'passivo' ? 'selected' : ''}>Passivo (ciò che devi)</option></select>
    ${selAcc}
    <label class="lbl">Categoria</label><select id="fc" data-act="fcat">${CATS[tipo].map(c => `<option ${cat === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
    ${selMod}
    ${isInv ? '' : `<label class="lbl">Nome (es. Conto Fineco, Mutuo casa)</label><input id="fn" maxlength="60" value="${esc(g('fn', ed ? ed.nome : ''))}">`}
    ${campi}
    <div class="acts"><button class="b" data-act="save">${ed ? 'Salva modifica' : 'Aggiungi'}</button>${ed ? '<button class="b s" data-act="cancel">Annulla</button>' : ''}</div>` : ''}</div>`;
  return `${filtro}<div class="card"><div class="lbl">Patrimonio netto</div><div class="big ${cls(t.netto)}">${eur(t.netto)}</div></div>
    <div class="two"><div class="card at"><div class="lbl">Attivi</div><div class="big">${eur(t.attivi)}</div></div>
    <div class="card pa"><div class="lbl">Passivi</div><div class="big neg">${eur(t.passivi)}</div></div></div>
    <div class="card at"><h2>Attivi</h2>${listAttivi()}</div>
    <div class="card pa"><h2>Passivi</h2>${listPassivi()}</div>
    ${archSec}
    ${form}
    <div class="card"><h2>Esporta</h2><button class="b" data-act="export">Scarica i dati (CSV per Excel)</button></div>`;
}

  else if (isA) body = `<div class="acts" style="flex-direction:column"><button class="b" data-act="popres">Ripristina</button><button class="b r" data-act="popdel">Elimina</button><button class="b s" data-act="popclose">Chiudi</button></div>`;

const eur0 = v => new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0, useGrouping: 'always' }).format(v || 0);
const trunc = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;

function treeSvg(root, branches) {
  const colW = 176, nw = 160, nh = 46, lh = 40, rootY = 4, rootH = 62, b1Y = 112, b1H = 50, gY = 218, leafY0 = gY + nh + 14;
  const cols = branches.reduce((s, b) => s + b.groups.length, 0), W = Math.max(cols * colW, 360), off = (W - cols * colW) / 2, mid = W / 2;
  const maxL = Math.max(1, ...branches.flatMap(b => b.groups.map(g => g.items.length))), H = leafY0 + maxL * lh + 6;
  const TONE = { a: { st: '#0f766e', fill: '#d6f2ee', ln: '#4f9f96', leaf: '#b5d9d4', tx: '#16302d' }, p: { st: '#b91c1c', fill: '#fde8e8', ln: '#d96464', leaf: '#efb0b0', tx: '#b91c1c' } };
  const T = (x, y, s, sz, w, f, an = 'middle') => `<text x="${x}" y="${y}" font-size="${sz}" font-weight="${w}" fill="${f}" text-anchor="${an}">${esc(s)}</text>`;
  let o = '', col = 0;
  branches.forEach(b => {
    const c = TONE[b.tone], first = off + col * colW + colW / 2, last = off + (col + b.groups.length - 1) * colW + colW / 2, bx = (first + last) / 2;
    const m1 = (rootY + rootH + b1Y) / 2, m2 = (b1Y + b1H + gY) / 2;
    o += `<path d="M${mid} ${rootY + rootH} C${mid} ${m1} ${bx} ${m1} ${bx} ${b1Y}" fill="none" stroke="${c.ln}" stroke-width="3"/>`;
    b.groups.forEach((g, i) => {
      const x = off + (col + i) * colW + colW / 2, gx = x - nw / 2, rail = gx + 12, lx = rail + 12, lw = gx + nw - lx;
      o += `<path d="M${bx} ${b1Y + b1H} C${bx} ${m2} ${x} ${m2} ${x} ${gY}" fill="none" stroke="${c.ln}" stroke-width="2.5"/>`;
      o += `<rect x="${gx}" y="${gY}" width="${nw}" height="${nh}" rx="10" fill="${c.fill}" stroke="${c.st}" stroke-width="1.8"/>` + T(x, gY + 19, trunc(g.label, 22), 11, 600, '#16302d') + T(x, gY + 35, eur0(g.sum) + (g.pct ? ' · ' + g.pct : ''), 10.5, 600, c.tx);
      if (g.items.length) o += `<line x1="${rail}" x2="${rail}" y1="${gY + nh}" y2="${leafY0 + (g.items.length - 1) * lh + 23}" stroke="${c.ln}" stroke-width="2"/>`;
      g.items.forEach((it, j) => {
        const y = leafY0 + j * lh;
        o += `<line x1="${rail}" x2="${lx}" y1="${y + 23}" y2="${y + 23}" stroke="${c.ln}" stroke-width="2"/><g><title>${esc(it.nome + ' · ' + it.sub + ' · ' + eur(it.val))}</title>`
          + `<rect x="${lx}" y="${y}" width="${lw}" height="${lh - 6}" rx="8" fill="#fff" stroke="${c.leaf}" stroke-width="1.5"/>`
          + T(lx + 8, y + 14, trunc(it.nome, 20), 10.5, 600, '#16302d', 'start')
          + T(lx + 8, y + 27, eur0(it.val) + (it.pct ? ' · ' + it.pct : ''), 10, 600, c.tx, 'start') + '</g>';

  const last = all[all.length - 1].mese; let kA;
  if (mode === 'y') { const y = +last.slice(0, 4), m = +last.slice(5); kA = Array.from({ length: m }, (_, i) => `${y}-${String(i + 1).padStart(2, '0')}`); }
  else { const N = +mode; kA = Array.from({ length: N }, (_, i) => addMk(last, i - N + 1)); }
  const kB = kA.map(k => addMk(k, mode === 'y' ? -12 : -(+mode)));
  const dl = k => map[k] != null && map[addMk(k, -1)] != null ? map[k] - map[addMk(k, -1)] : null;
  const cu = ks => { const base = map[addMk(ks[0], -1)]; return ks.map(k => base != null && map[k] != null ? map[k] - base : null); };
  return { kA, kB, dA: kA.map(dl), dB: kB.map(dl), cA: cu(kA), cB: cu(kB) };
}
function cmpBars(d) {
  const n = d.kA.length, W = CW(), H = Math.round(CHt(W) * 0.85), L = 50, R = 12, T = 12, B = 28, half = (H - T - B) / 2, mid = T + half;
  const mx = Math.max(1, ...d.dA.concat(d.dB).filter(v => v != null).map(Math.abs)), slot = (W - L - R) / n, bw = Math.min(18, slot * 0.38), step = Math.ceil(n / 8);
  let o = [mx, 0, -mx].map(t => `<line x1="${L}" x2="${W - R}" y1="${(mid - t / mx * half).toFixed(1)}" y2="${(mid - t / mx * half).toFixed(1)}" stroke="${t === 0 ? '#9db3af' : '#e2eceb'}"/><text x="${L - 6}" y="${(mid - t / mx * half + 4).toFixed(1)}" font-size="11" fill="#5b7370" text-anchor="end">${compact(t)}</text>`).join('');
  const bar = (v, cx, col, tip) => { if (v == null) return ''; const h = Math.abs(v) / mx * half; return `<rect x="${cx.toFixed(1)}" y="${(v >= 0 ? mid - h : mid).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h, 1.5).toFixed(1)}" rx="2.5" fill="${col}" data-tip="${esc(tip)}"/>`; };
  for (let i = 0; i < n; i++) {
    const cx = L + slot * (i + 0.5);
    o += bar(d.dB[i], cx - bw - 1, '#9aa9c7', `${shortM(d.kB[i])}: ${d.dB[i] == null ? '–' : eur(d.dB[i])}`) + bar(d.dA[i], cx + 1, '#1d4ed8', `${shortM(d.kA[i])}: ${d.dA[i] == null ? '–' : eur(d.dA[i])}`);
    if (i % step === 0 || i === n - 1) o += `<text x="${cx.toFixed(1)}" y="${H - 8}" font-size="11" fill="#5b7370" text-anchor="middle">${shortM(d.kA[i])}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}">${o}</svg>`;
}
const CMP_OPT = [['y', 'Anno in corso vs anno precedente'], ['12', 'Ultimi 12 mesi vs 12 precedenti'], ['6', 'Ultimi 6 mesi vs 6 precedenti'], ['3', 'Ultimi 3 mesi vs 3 precedenti']];
function cmpCards(all) {
  const mode = S.cmp || 'y', sel = `<select data-act="cmpm">${CMP_OPT.map(([v, l]) => `<option value="${v}" ${mode === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  const d = cmpData(all, mode);
  if (!d.dB.some(v => v != null) && !d.cB.some(v => v != null)) return `<div class="card"><h2>Confronto tra periodi</h2>${sel}<p class="note">Per questo confronto servono più mesi di storico (anche quelli del periodo precedente).</p></div>`;
  const lg = [{ k: 'a', c: '#1d4ed8', l: 'Periodo attuale' }, { k: 'b', c: '#9aa9c7', l: 'Periodo precedente', dash: true }];
  const pts = d.kA.map((k, i) => ({ lab: shortM(k), long: shortM(k) + ' / ' + shortM(d.kB[i]), a: d.cA[i], b: d.cB[i] }));
  return `<div class="card"><h2>Confronto tra periodi</h2>${sel}<div class="legend"><span><i style="background:#1d4ed8"></i>Periodo attuale</span><span><i style="background:#9aa9c7"></i>Periodo precedente</span></div>
    <h3 style="font-size:14px;margin:8px 0 2px">Variazione mensile del patrimonio netto</h3>${cmpBars(d)}</div>` + lcCard('cmp', 'Crescita accumulata: periodo attuale e precedente', pts, lg);
}

function popupM() {
  const p = S.popm, s = S.data.storico.find(x => x.mese === p.mese); if (!s) return '';
  const body = p.mode === 'del' ? `<p style="margin-top:0">Vuoi davvero eliminare <b>${esc(monthName(s.mese))}</b> dallo storico?</p><div class="acts"><button class="b r" data-act="pmdelok">Sì, elimina</button><button class="b s" data-act="pmback">Annulla</button></div>`
    : `<div class="acts" style="flex-direction:column"><button class="b" data-act="pmedit">Modifica</button><button class="b r" data-act="pmdel">Elimina</button><button class="b s" data-act="pmclose">Chiudi</button></div>`;
  return `<div class="ov" data-act="pmclose"></div><div class="pop"><h2 style="margin-bottom:2px">${esc(monthName(s.mese))}</h2><div class="lbl" style="margin-bottom:12px">Attivi ${eur(s.attivi)} · Passivi ${eur(s.passivi)} · Netto ${eur(s.netto)}</div>${body}</div>`;
}

function barSvg(st) {
  const d = st.slice(1).map((s, i) => ({ m: s.mese, v: s.netto - st[i].netto }));
  const W = CW(), H = Math.round(CHt(W) * 0.8), L = 50, R = 12, T = 12, B = 28, mid = T + (H - T - B) / 2, half = (H - T - B) / 2;
  const mx = Math.max(1, ...d.map(z => Math.abs(z.v))), slot = (W - L - R) / d.length, bw = Math.min(40, slot * 0.6), step = Math.ceil(d.length / 6);
  let o = [mx, 0, -mx].map(t => `<line x1="${L}" x2="${W - R}" y1="${(mid - t / mx * half).toFixed(1)}" y2="${(mid - t / mx * half).toFixed(1)}" stroke="${t === 0 ? '#9db3af' : '#e2eceb'}"/><text x="${L - 6}" y="${(mid - t / mx * half + 4).toFixed(1)}" font-size="11" fill="#5b7370" text-anchor="end">${compact(t)}</text>`).join('');
  d.forEach((z, i) => {
    const cx = L + slot * (i + 0.5), h = Math.abs(z.v) / mx * half;
    o += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${(z.v >= 0 ? mid - h : mid).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h, 1).toFixed(1)}" rx="3" fill="${z.v >= 0 ? '#15803d' : '#b91c1c'}"/>`;
    if (i % step === 0 || i === d.length - 1) o += `<text x="${cx.toFixed(1)}" y="${H - 8}" font-size="11" fill="#5b7370" text-anchor="middle">${shortM(z.m)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}">${o}</svg>`;
}

function formMese(force) {
  const D = S.data; if (D.readonly) return '';
  const open = force || S.editM || (S.exp && S.exp.fm);
  if (!open) return `<div class="card"><div class="row cl cat" data-act="exp" data-v="fm" style="border:0;padding:0"><div class="n">Ricostruisci lo storico<small>aggiungi i mesi passati a mano o da file</small></div><span class="chev">▸︎</span></div></div>`;
  const e = S.editM && D.storico.find(x => x.mese === S.editM), dr = S.draft || {};
  const f = v => String(v).replace('.', ',');
  return `<div class="card" id="formm"><h2>${e ? 'Modifica mese' : 'Ricostruisci lo storico'}</h2><div class="msg">${esc(S.msg)}</div>
    <p class="note" style="margin-top:0">Inserisci i totali di un mese passato. Ripeti per ogni mese che vuoi aggiungere.</p>
    <label class="lbl">Mese (formato AAAA-MM, es. 2026-03)</label><input id="mm" type="month" placeholder="AAAA-MM" max="${prevMonth()}" value="${esc(e ? e.mese : dr.mm || '')}" ${e ? 'readonly' : ''}>
    <label class="lbl">Totale attivi (€)</label><input id="ma" inputmode="decimal" value="${esc(e ? f(e.attivi) : dr.ma || '')}">
    <label class="lbl">Totale passivi (€)</label><input id="mp" inputmode="decimal" value="${esc(e ? f(e.passivi) : dr.mp || '')}">
    <div class="acts"><button class="b" data-act="savem">Salva mese</button>${e ? '<button class="b s" data-act="cancelm">Annulla</button>' : ''}</div>
    ${e ? '' : `<hr style="border:0;border-top:1px solid #e2eceb;margin:16px 0 10px"><label class="lbl">Oppure importa molti mesi insieme da un file (righe: mese;attivi;passivi, es. 2024-05;120000;8000)</label><input id="impf" type="file" accept=".csv,.txt"><div class="msg" id="impmsg"></div>`}</div>`;
}

function pageAnd() {
  const all = S.data.storico, rg = String(S.range || '12');
  if (!all.length) return formMese(true) + '<div class="card">Nessuno storico disponibile. Inserisci i mesi passati qui sopra, oppure aggiungi le voci nella pagina Patrimonio: ogni mese ne viene salvata una fotografia.</div>';
  const yy = +monthKey().slice(0, 4);
  const rF = S.rFrom || all[0].mese, rT = S.rTo || all[all.length - 1].mese, lo_ = rF <= rT ? rF : rT, hi_ = rF <= rT ? rT : rF;
  const st = rg === 'custom' ? all.filter(s => s.mese >= lo_ && s.mese <= hi_) : rg === '0' ? all : rg === 'ytd' ? all.filter(s => s.mese >= (yy - 1) + '-12') : all.slice(-(+rg));
  const sel = `<select data-act="range">${[['3', 'Ultimi 3 mesi'], ['6', 'Ultimi 6 mesi'], ['ytd', 'Da inizio anno'], ['12', 'Ultimi 12 mesi'], ['36', 'Ultimi 3 anni'], ['0', 'Tutto lo storico'], ['custom', 'Periodo personalizzato']].map(([v, l]) => `<option value="${v}" ${rg === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  const L = [{ k: 'attivi', c: '#0f766e', l: 'Attivi' }, { k: 'passivi', c: '#b91c1c', l: 'Passivi' }, { k: 'netto', c: '#1d4ed8', l: 'Patrimonio netto' }];
  const pts = st.map(s => ({ lab: shortM(s.mese), long: monthName(s.mese), attivi: s.attivi, passivi: s.passivi, netto: s.netto }));
  const rows = all.map((s, i) => ({ s, d: i ? s.netto - all[i - 1].netto : null })).reverse(), topen = S.exp && S.exp.stab;
  const cust = rg === 'custom' ? `<div class="grid" style="margin-top:8px"><div><label class="lbl">Dal mese</label><input type="month" data-act="rfrom" value="${esc(lo_)}" min="${all[0].mese}" max="${all[all.length - 1].mese}"></div><div><label class="lbl">Al mese</label><input type="month" data-act="rto" value="${esc(hi_)}" min="${all[0].mese}" max="${all[all.length - 1].mese}"></div></div>` : '';
  return `<div class="card">${sel}${cust}${st.length < 2 ? '<p class="note">I grafici compariranno quando ci saranno almeno 2 mesi di dati. Ogni mese viene salvata una fotografia del tuo patrimonio quando apri l\'app.</p>' : ''}</div>
    ${st.length > 1 ? lcCard('main', 'Attivi, passivi e patrimonio netto', pts, L) : ''}
    ${st.length > 1 ? lcCard('net', 'Variazione totale del patrimonio netto nel periodo', st.map(x => ({ lab: shortM(x.mese), long: monthName(x.mese), abs: x.netto, var: 0 })), [{ k: 'var', c: '#1d4ed8', l: 'Variazione dal primo mese visibile', zero: 1, rebase: 1 }, { k: 'g', c: '#b91c1c', l: 'Sotto lo zero', ghost: 1 }]) : ''}
    ${st.length > 1 ? `<div class="card"><h2>Variazione mensile del patrimonio netto</h2><div class="legend"><span><i style="background:#15803d"></i>Aumento</span><span><i style="background:#b91c1c"></i>Calo</span></div>${barSvg(st)}</div>` : ''}

    ${topen ? `<div class="tw" style="margin-top:8px"><table><tr><th>Mese</th><th>Attivi</th><th>Passivi</th><th>Netto</th><th>Var.</th></tr>
    ${rows.map(({ s, d }) => `<tr${s.mese < monthKey() ? ` class="cl" data-act="rowm" data-v="${s.mese}"` : ''}><td>${esc(shortM(s.mese))}${s.manuale ? ' ✎' : ''}</td><td>${eur(s.attivi)}</td><td>${eur(s.passivi)}</td><td><b>${eur(s.netto)}</b></td><td class="${d === null ? '' : cls(d)}">${d === null ? '–' : (d >= 0 ? '+' : '') + eur(d)}</td></tr>`).join('')}</table></div>` : ''}</div>

function indicatori(D, st) {
  const t = totals(D.voci), cur = st[st.length - 1], map = {}; st.forEach(s => map[s.mese] = s);
  const att = D.voci.filter(v => v.tipo === 'attivo'), sumC = c => att.filter(v => v.categoria === c).reduce((s, v) => s + v.valore, 0);
  const P = v => (v * 100).toFixed(1).replace('.', ',') + '%', I = [];
  if (t.attivi > 0) {
    const r = t.passivi / t.attivi;
    I.push(['Indebitamento', P(r), r < 0.3 ? 'pos' : r < 0.6 ? '' : 'neg', 'Quanta parte di ciò che possiedi è coperta da debiti (passivi diviso attivi). Conta perché più è alto, meno margine hai se i valori scendono o le entrate calano. Come regola generale sotto il 30% è contenuto, sopra il 60% va tenuto d\'occhio.']);
    I.push(['Peso della liquidità', P(sumC('Liquidità') / t.attivi), '', 'Quota dei tuoi attivi tenuta in conti e contanti, disponibile subito. Serve per gli imprevisti: se è troppo bassa rischi di dover vendere gli investimenti nel momento sbagliato, se è troppo alta l\'inflazione ne riduce il valore nel tempo.']);
    I.push(['Peso degli investimenti', P(sumC('Investimenti') / t.attivi), '', 'Quota degli attivi messa in investimenti. Dice quanto il tuo patrimonio dipende dall\'andamento dei mercati: più è alta, più può crescere ma anche oscillare.']);
    const top = att.slice().sort((a, b) => b.valore - a.valore)[0];
    if (top) I.push(['Concentrazione', P(top.valore / t.attivi), top.valore / t.attivi > 0.6 ? 'neg' : '', `Peso della voce più grande (${esc(top.nome)}) sul totale degli attivi. Se una sola voce supera il 60%, il tuo patrimonio dipende troppo da lei: distribuire su più voci riduce il rischio.`]);
  }
  const yr = cur.mese.slice(0, 4), prevs = st.filter(s => s.mese < yr + '-01'), b0 = prevs[prevs.length - 1];
  if (b0 && b0.netto) { const d = cur.netto - b0.netto; I.push(['Crescita da inizio anno', `${d >= 0 ? '+' : ''}${eur0(d)} (${pct(d / Math.abs(b0.netto))})`, cls(d), 'Quanto è cambiato il patrimonio netto dall\'ultimo mese dell\'anno scorso. Comprende ciò che hai risparmiato, i debiti rimborsati e la variazione dei valori: non è un rendimento puro, ma dice se nell\'anno stai avanzando.']); }
  const m12 = map[addMk(cur.mese, -12)];
  if (m12 && m12.netto) { const d = cur.netto - m12.netto; I.push(['Crescita ultimi 12 mesi', `${d >= 0 ? '+' : ''}${eur0(d)} (${pct(d / Math.abs(m12.netto))})`, cls(d), 'Confronto con lo stesso mese di un anno fa. Elimina l\'effetto delle stagioni (tredicesime, vacanze, tasse) ed è il modo più pulito per capire il ritmo reale di crescita.']); I.push(['Variazione media mensile', `${d >= 0 ? '+' : ''}${eur0(d / 12)}`, cls(d), 'Di quanto cresce in media il patrimonio ogni mese negli ultimi 12 mesi. Serve a capire se il ritmo è costante e a stimare i tempi per raggiungere un obiettivo.']); }
  const f = st[0], mths = (+cur.mese.slice(0, 4) - +f.mese.slice(0, 4)) * 12 + (+cur.mese.slice(5) - +f.mese.slice(5));
  if (mths >= 12 && f.netto > 0 && cur.netto > 0) { const g = Math.pow(cur.netto / f.netto, 12 / mths) - 1; I.push(['Crescita annua media (CAGR)', pct(g), cls(g), 'Tasso di crescita annuo composto: di quanto è cresciuto in media ogni anno il patrimonio, come se la crescita fosse stata costante. Permette di confrontare periodi diversi. Include anche i tuoi versamenti, quindi non è il rendimento dei soli investimenti.']); }
  let pk = -Infinity, pkm = '', worst = 0, wm = '';
  st.forEach(s => { if (s.netto > pk) { pk = s.netto; pkm = s.mese; } if (pk > 0) { const dd = (s.netto - pk) / pk; if (dd < worst) { worst = dd; wm = s.mese; } } });
  if (st.length > 2) I.push(['Calo massimo', worst < 0 ? `${P(worst)} (${shortM(wm)})` : 'Nessun calo', worst < -0.1 ? 'neg' : '', 'La discesa più forte dal punto più alto a quello più basso successivo. Mostra quanto hai "sofferto" nei momenti peggiori: serve a capire se il rischio che stai prendendo è sopportabile.']);
  const ob = att.filter(v => v.obiettivo > 0);
  if (ob.length) { const o = ob.reduce((s, v) => s + v.obiettivo, 0), g = ob.reduce((s, v) => s + v.valore, 0); I.push(['Avanzamento obiettivi', P(g / o), '', 'Quanta parte degli obiettivi fissati sugli investimenti è già raggiunta (valore attuale diviso obiettivo). Aiuta a capire quanta strada manca.']); }
  return `<div class="card"><h2>Indicatori patrimoniali</h2>${I.map(([l, v, c, ex], i) => `<div class="row"><div class="n">${l}<button class="ib" data-act="exp" data-v="i:${i}" aria-label="Spiegazione">i</button></div><div class="v ${c}">${v}</div></div>${S.exp && S.exp['i:' + i] ? `<p class="note ex">${ex}</p>` : ''}`).join('')}<p class="note">Tocca la "i" per capire a cosa serve ogni indicatore. Informazioni generali a scopo educativo.</p></div>`;
}

function pageRep() {
  const D = S.data, st = D.storico;
  if (!st.length) return '<div class="card">Nessun dato disponibile. Inserisci almeno una voce nella pagina Patrimonio.</div>';
  const cur = st[st.length - 1], prev = st.length > 1 ? st[st.length - 2] : null;
  const dN = prev ? cur.netto - prev.netto : null, dA = prev ? cur.attivi - prev.attivi : null, dP = prev ? cur.passivi - prev.passivi : null;
  const dpct = prev && prev.netto ? dN / Math.abs(prev.netto) : null;
  const byCat = tp => {
    const m = {}; D.voci.filter(v => v.tipo === tp).forEach(v => m[v.categoria] = (m[v.categoria] || 0) + v.valore);
    const e = Object.entries(m).sort((a, b) => b[1] - a[1]);
    return e.length ? e.map(([c, v]) => `<div class="row"><div class="n">${esc(c)}</div><div class="v">${eur(v)}</div></div>`).join('') : '<p class="note">Nessuna voce.</p>';
  };
  const dl = (l, v) => v === null ? '' : `<div class="row"><div class="n">${l}</div><div class="v ${l === 'Passivi' ? cls(-v) : cls(v)}">${v >= 0 ? '+' : ''}${eur(v)}</div></div>`;
  // commenti educativi
  const c = [];
  c.push('Il <b>patrimonio netto</b> è ciò che possiedi meno ciò che devi: è il numero più importante da seguire nel tempo.');
  if (dN !== null) c.push(dN >= 0
    ? `Nel mese il patrimonio netto è <b>aumentato</b> di ${eur(dN)}. Può dipendere da risparmio, rimborso di debiti o variazione dei valori.`
    : `Nel mese il patrimonio netto è <b>diminuito</b> di ${eur(-dN)}. Può dipendere da spese, nuovi debiti o variazione dei valori.`);
  if (cur.attivi > 0) {
    const r = cur.passivi / cur.attivi;
    c.push(`I debiti sono il <b>${(r * 100).toFixed(0)}%</b> di ciò che possiedi. ` + (r < 0.3 ? 'Come regola generale è un livello contenuto.' : r < 0.6 ? 'Come regola generale è un livello medio: conviene tenere d\'occhio le rate.' : 'Come regola generale è un livello alto: le rate pesano molto sul patrimonio.'));
    const liq = D.voci.filter(v => v.categoria === 'Liquidità').reduce((s, v) => s + v.valore, 0) / cur.attivi;
    if (liq > 0.5) c.push('Oltre metà dei tuoi attivi è in liquidità: nel tempo l\'inflazione ne riduce il valore reale.');
    else if (liq < 0.05) c.push('Hai poca liquidità: di solito si consiglia un fondo per imprevisti pari a 3-6 mesi di spese.');
    const top = Math.max(0, ...D.voci.filter(v => v.tipo === 'attivo').map(v => v.valore)) / cur.attivi;
    if (top > 0.6) c.push('Una sola voce vale oltre il 60% dei tuoi attivi: avere tutto in un solo posto aumenta il rischio.');
  }
  return `<div class="card"><h2>Report di ${esc(monthName(cur.mese))}</h2>
    <div class="grid"><div><div class="lbl">Patrimonio netto</div><div class="big ${cls(cur.netto)}">${eur(cur.netto)}</div></div>
    ${dN !== null ? `<div><div class="lbl">Rispetto a ${esc(monthName(prev.mese))}</div><div class="big ${cls(dN)}">${dN >= 0 ? '+' : ''}${eur(dN)}</div>${dpct !== null ? `<div class="lbl">${pct(dpct)}</div>` : ''}</div>` : ''}</div>
    ${dN !== null ? `<div style="margin-top:12px">${dl('Attivi', dA)}${dl('Passivi', dP)}</div>` : '<p class="note">Il confronto con il mese precedente sarà disponibile dal prossimo mese.</p>'}</div>
    ${indicatori(D, st)}
    <div class="grid"><div class="card"><h2>Attivi per categoria</h2>${byCat('attivo')}</div><div class="card"><h2>Passivi per categoria</h2>${byCat('passivo')}</div></div>
    <div class="card"><h2>Lo sapevi?</h2><ul class="c">${c.map(x => `<li>${x}</li>`).join('')}</ul>
    <p class="note">Informazioni generali a scopo educativo, non consulenza finanziaria.</p></div>`;
}

function pageAdm() {
  const u = S.users, pend = u.filter(x => !x.approved), ok = u.filter(x => x.approved);
  const row = (x, p) => `<div class="row"><div class="n">${esc(x.nome)}</div>
    ${p ? `<button class="b sm" data-act="appr" data-v="${x.uid}">Approva</button><button class="b r sm" data-act="rej" data-v="${x.uid}">Rifiuta</button>`
        : `<button class="b r sm" data-act="rev" data-v="${x.uid}">Revoca</button>`}</div>`;
  return `<div class="card"><h2>In attesa di approvazione (${pend.length})</h2>${pend.length ? pend.map(x => row(x, true)).join('') : '<p class="note">Nessuna richiesta.</p>'}</div>
    <div class="card"><h2>Utenti approvati (${ok.length})</h2>${ok.length ? ok.map(x => row(x, false)).join('') : '<p class="note">Nessun utente.</p>'}</div>
    <div class="card"><button class="b s" data-act="reload-users">Aggiorna elenco</button></div>`;
}

/* ---------- Azioni ---------- */
function exportCsv() {
  const D = S.data, n = v => String(v).replace('.', ',');
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  let out = 'Tipo;Categoria;Account;Nome;Valore;Dove;Obiettivo\n' + D.voci.map(v => [v.tipo, q(v.categoria), q(accName(v)), q(v.nome), n(v.valore), q(v.dove || ''), v.obiettivo ? n(v.obiettivo) : ''].join(';')).join('\n');
  out += '\n\nMese;Attivi;Passivi;Netto\n' + D.storico.map(s => [s.mese, n(s.attivi), n(s.passivi), n(s.netto)].join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + out], { type: 'text/csv;charset=utf-8' }));
  a.download = 'pfinance_' + D.nome.replace(/[^a-z0-9]/gi, '') + '_' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click(); URL.revokeObjectURL(a.href);
}

const FIDS = ['ft', 'fm', 'fa', 'fc', 'fn', 'fv', 'fk', 'fi', 'ff', 'fw', 'fwn', 'fo'];
function grabForm() { const o = {}; FIDS.forEach(id => { const e = $(id); if (e) o[id] = e.value; }); return o; }

async function act(el) {
  let a = el.dataset.act; const v = el.dataset.v, D = S.data;
  S.msg = '';
  try {
    if (a === 'terms') { S.tab = 'terms'; S.menu = false; return render(); }
    if (a === 'accept') {
      if (!$('tc') || !$('tc').checked) { S.msg = 'Per continuare devi spuntare la casella di accettazione.'; return render(); }
      await updateDoc(doc(db, 'users', S.user.uid), { termini: TERMS_V, terminiAt: serverTimestamp() });
      S.profile.termini = TERMS_V; S.msg = ''; return render();
    }
    if (a === 'pg') {
      const i = ORD.indexOf(S.tab), n = i + (+v); if (i < 0 || n < 0 || n >= ORD.length) return;
      S.tab = ORD[n]; render(); window.scrollTo(0, 0);
      const nv = document.querySelector('nav'), on = nv && nv.querySelector('button.on'); if (on) nv.scrollLeft = on.offsetLeft - (nv.clientWidth - on.offsetWidth) / 2;
      return;
    }
    if (a === 'mode') { S.mode = v; return render(); }
    if (a === 'login' || a === 'register') {
      const n = $('nm').value.trim(), p = $('pn').value.trim();
      if (mailOf(n).length < 14) { S.msg = 'Inserisci un nome valido.'; return render(); }
      if (!/^\d{6}$/.test(p)) { S.msg = 'Il PIN deve essere di 6 cifre.'; return render(); }
      if (a === 'register') { S.pendingName = n; await createUserWithEmailAndPassword(auth, mailOf(n), p); }
      else await signInWithEmailAndPassword(auth, mailOf(n), p);
      return;
    }
    if (a === 'logout') { S.tab = 'pat'; S.mode = 'login'; S.menu = false; S.pop = null; S.fAcc = 'all'; return signOut(auth); }
    if (a === 'refresh') return location.reload();
    if (a === 'tab') { S.tab = v; return render(); }
    if (a === 'facc') { S.fAcc = v; S.edit = null; S.menu = false; S.addAcc = false; return render(); }
    if (a === 'admin') { S.tab = 'adm'; S.menu = false; S.addAcc = false; return render(); }
    if (a === 'exp') { S.exp = S.exp || {}; S.exp[v] = !S.exp[v]; return render(); }
    if (a === 'menu') { S.menu = !S.menu; S.addAcc = false; return render(); }
    if (a === 'addo') { S.addAcc = true; render(); const i = $('an'); if (i) i.focus(); return; }
    if (a === 'addc') { S.addAcc = false; return render(); }
    if (a === 'pop') { S.pop = { id: v, mode: 'menu' }; return render(); }
    if (a === 'popclose') { S.pop = null; return render(); }
    if (a === 'popback') { S.pop.mode = 'menu'; return render(); }
    if (a === 'popupd') { S.pop.mode = 'upd'; return render(); }
    if (a === 'popdel') { S.pop.mode = 'del'; return render(); }
    if (a === 'popedit') { S.edit = S.pop.id; S.fd = null; S.pop = null; render(); const f = $('formvoce'); if (f) f.scrollIntoView({ behavior: 'smooth' }); return; }
    if (a === 'updsave') {
      const x = D.voci.find(z => z.id === S.pop.id), nv = pnum($('pv').value);
      if (!isFinite(nv) || nv < 0) { S.msg = 'Inserisci un valore valido (zero o più).'; return render(); }
      const { id: _i, ...rest } = x, dati = { ...rest, valore: r2(nv) };
      await setDoc(doc(db, 'users', D.uid, 'voci', x.id), dati); Object.assign(x, dati);
      await syncStorico(); S.pop = null; S.msg = 'Valore aggiornato.'; return render();
    }
    if (a === 'poparch') {
      const x0 = D.voci.find(z => z.id === S.pop.id);
      if (x0 && x0.valore !== 0) { S.pop.mode = 'arch'; return render(); }
      a = 'poparchok';
    }
    if (a === 'poparchok' || a === 'popres') {
      const id = S.pop.id, to = a === 'poparchok', from = to ? D.voci : D.arch, dest = to ? D.arch : D.voci, i = from.findIndex(z => z.id === id);
      if (i < 0) return;
      await updateDoc(doc(db, 'users', D.uid, 'voci', id), { archiviata: to });
      const [x] = from.splice(i, 1); x.archiviata = to; if (!to) applyPiano(x); dest.push(x);
      await syncStorico(); S.pop = null; S.msg = to ? 'Archiviato. Non conta più nei totali, lo storico resta.' : 'Ripristinato.'; return render();
    }
    if (a === 'delok') {
      const id = S.pop.id; D.arch = (D.arch || []).filter(z => z.id !== id);
      await deleteDoc(doc(db, 'users', D.uid, 'voci', id));
      D.voci = D.voci.filter(z => z.id !== id); await syncStorico(); S.pop = null; return render();
    }
    if (a === 'dview') { S.dview = v; S.pieSel = null; S.pieSel2 = null; return render(); }
    if (a === 'piet') { S.anim = true; S.pie = v; S.pieSel = null; S.pieSel2 = null; return render(); }
    if (a === 'pies') { S.anim = 'sel'; S.pieSel = S.pieSel === +v ? null : +v; S.pieSel2 = null; return render(); }
    if (a === 'pies2') { S.anim = 'sel'; const [g, j] = v.split('-').map(Number); if (S.pieSel === g && S.pieSel2 === j) S.pieSel2 = null; else { S.pieSel = g; S.pieSel2 = j; } return render(); }
    if (a === 'dmode') { S.dmode = el.value; return render(); }
    if (a === 'adda') {
      const nm = $('an').value.trim();
      if (!nm) { S.msg = 'Scrivi il nome dell\'account.'; return render(); }
      if (D.accounts.length >= 10) { S.msg = 'Massimo 10 account.'; return render(); }
      if ([D.nome, ...D.accounts.map(x => x.nome)].some(x => x.toLowerCase() === nm.toLowerCase())) { S.msg = 'Esiste già un account con questo nome.'; return render(); }
      const r = await addDoc(collection(db, 'users', D.uid, 'account'), { nome: nm });
      D.accounts.push({ id: r.id, nome: nm }); D.accounts.sort((x, y) => x.nome.localeCompare(y.nome)); S.addAcc = false; S.msg = 'Account aggiunto.'; return render();
    }
    if (a === 'rena') {
      const ac = D.accounts.find(x => x.id === v), nm = (prompt('Nuovo nome dell\'account', ac.nome) || '').trim();
      if (!nm || nm === ac.nome) return;
      if ([D.nome, ...D.accounts.filter(x => x.id !== v).map(x => x.nome)].some(x => x.toLowerCase() === nm.toLowerCase())) { S.msg = 'Esiste già un account con questo nome.'; return render(); }
      await setDoc(doc(db, 'users', D.uid, 'account', v), { nome: nm }); ac.nome = nm; D.accounts.sort((x, y) => x.nome.localeCompare(y.nome)); return render();
    }
    if (a === 'dela') {
      if (D.voci.some(x => x.account === v)) { S.msg = 'Prima sposta o elimina le voci di questo account.'; return render(); }
      if (!confirm('Eliminare questo account?')) return;
      await deleteDoc(doc(db, 'users', D.uid, 'account', v)); D.accounts = D.accounts.filter(x => x.id !== v);
      if (S.fAcc === v) S.fAcc = 'all'; return render();
    }
    if (a === 'range') { S.range = el.value; return render(); }
    if (a === 'rfrom' || a === 'rto') { if (!/^\d{4}-\d{2}$/.test(el.value)) return; if (a === 'rfrom') S.rFrom = el.value; else S.rTo = el.value; return render(); }
    if (a === 'cmpm') { S.cmp = el.value; return render(); }
    if (a === 'fs') { S.fs = v || null; return render(); }
    if (a === 'zm') {
      const k = el.dataset.k, c = CHK[k]; if (!c) return; const z = ZM[k] || { a: 0, b: c.pts.length - 1 }, sp = z.b - z.a, m = (z.a + z.b) / 2;
      if (v === '0') { delete ZM[k]; lcRepaint(k); } else if (v === 'in') lcZoom(k, 1.6, m); else if (v === 'out') lcZoom(k, 1 / 1.6, m); else lcPan(k, (v === 'l' ? -1 : 1) * sp * 0.35);
      return;
    }
    if (a === 'rowm') { S.popm = { mese: v, mode: 'menu' }; return render(); }
    if (a === 'pmclose') { S.popm = null; return render(); }
    if (a === 'pmback') { S.popm.mode = 'menu'; return render(); }
    if (a === 'pmdel') { S.popm.mode = 'del'; return render(); }
    if (a === 'pmedit') { S.editM = S.popm.mese; S.draft = null; S.popm = null; render(); const fm = $('formm'); return fm ? fm.scrollIntoView({ behavior: 'smooth' }) : window.scrollTo(0, 0); }
    if (a === 'pmdelok') { const m = S.popm.mese; await deleteDoc(doc(db, 'users', D.uid, 'storico', m)); D.storico = D.storico.filter(x => x.mese !== m); S.popm = null; return render(); }
    if (a === 'editm') { S.editM = v; S.draft = null; render(); return window.scrollTo(0, 0); }
    if (a === 'cancelm') { S.editM = null; return render(); }
    if (a === 'delm') {
      if (!confirm('Eliminare questo mese dallo storico?')) return;
      await deleteDoc(doc(db, 'users', D.uid, 'storico', v));
      D.storico = D.storico.filter(x => x.mese !== v); return render();
    }
    if (a === 'savem') {
      const mm = $('mm').value.trim(), at = pnum($('ma').value), pa = pnum($('mp').value);
      S.draft = S.editM ? null : { mm, ma: $('ma').value, mp: $('mp').value };
      if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(mm)) { S.msg = 'Inserisci il mese nel formato AAAA-MM (es. 2026-03).'; return render(); }
      if (mm >= monthKey()) { S.msg = 'Puoi inserire solo mesi passati: il mese in corso si aggiorna da solo.'; return render(); }
      if (!isFinite(at) || !isFinite(pa) || at < 0 || pa < 0) { S.msg = 'Inserisci attivi e passivi validi (zero o più).'; return render(); }
      const dati = { attivi: r2(at), passivi: r2(pa), netto: r2(at - pa) };
      await setDoc(doc(db, 'users', D.uid, 'storico', mm), { ...dati, manuale: true, aggiornato: serverTimestamp() });
      const ex = D.storico.find(x => x.mese === mm);
      if (ex) Object.assign(ex, dati, { manuale: true }); else { D.storico.push({ mese: mm, ...dati, manuale: true }); D.storico.sort((x, y) => x.mese.localeCompare(y.mese)); }
      S.editM = null; S.draft = null; S.msg = 'Mese salvato.'; render(); const fm = $('formm'); return fm && fm.scrollIntoView({ block: 'center' });
    }
    if (a === 'share') {
      const url = location.href.split('#')[0];
      const data = { title: 'P.Finance', text: 'Prova P.Finance: monitora il tuo patrimonio.', url };
      if (navigator.share) { try { await navigator.share(data); } catch (_) {} return; }
      try { await navigator.clipboard.writeText(url); S.msg = 'Link copiato negli appunti.'; } catch (_) { S.msg = 'Link: ' + url; }
      return render();
    }
    if (a === 'ftipo' || a === 'fmod' || a === 'fcat') { S.fd = grabForm(); return render(); }
    if (a === 'edit') { S.edit = v; return render(); }
    if (a === 'cancel') { S.edit = null; S.fd = null; return render(); }
    if (a === 'export') return exportCsv();
    if (a === 'save') {
      S.fd = grabForm();
      const tipo = $('ft').value, categoria = $('fc').value; let nome = $('fn') ? $('fn').value.trim() : '', fm = $('fm'), fa2 = $('fa');
      const base = { tipo, categoria, nome, account: fa2 && fa2.value !== 'main' ? fa2.value : '' };
      let dati;
      if (tipo === 'passivo' && fm && fm.value === 'piano') {
        const cap = pnum($('fk').value), ini = $('fi').value, fin = $('ff').value;
        if (!nome || !isFinite(cap) || cap <= 0) { S.msg = 'Inserisci un nome e l\'importo preso a prestito.'; return render(); }
        if (!ini || !fin || fin <= ini) { S.msg = 'Inserisci le date: la fine deve essere dopo l\'inizio.'; return render(); }
        dati = applyPiano({ ...base, piano: true, capitale: r2(cap), inizio: ini, fine: fin, valore: 0 });
      } else {
        const valore = pnum($('fv').value);
        const isI = tipo === 'attivo' && categoria === 'Investimenti';
        if (isI) { nome = ($('fw') ? ($('fw').value === '__new' ? ($('fwn') ? $('fwn').value.trim() : '') : $('fw').value) : ''); base.nome = nome; if (!nome) { S.msg = 'Scegli il conto di riferimento o scrivi il nome del nuovo conto.'; return render(); } }
        if (!nome || !isFinite(valore) || valore < 0) { S.msg = 'Inserisci un nome e un valore valido (zero o più).'; return render(); }
        dati = { ...base, valore: r2(valore) };
        if (tipo === 'attivo' && categoria === 'Investimenti') {
          const dove = nome, ob = $('fo') ? pnum($('fo').value) : NaN;
          dati.dove = dove; dati.nome = dove;
          if (!D.voci.some(x => x.categoria === 'Liquidità' && x.nome.toLowerCase() === dove.toLowerCase())) {
            const nl = { tipo: 'attivo', categoria: 'Liquidità', nome: dove, account: base.account, valore: 0 };
            const r0 = await addDoc(collection(db, 'users', D.uid, 'voci'), nl); D.voci.push({ id: r0.id, ...nl });
          }
          if (isFinite(ob) && ob > 0) dati.obiettivo = r2(ob);
        }
      }
      if (S.edit) { await setDoc(doc(db, 'users', D.uid, 'voci', S.edit), dati); const i = D.voci.findIndex(x => x.id === S.edit); D.voci[i] = { id: S.edit, ...dati }; }
      else { const r = await addDoc(collection(db, 'users', D.uid, 'voci'), dati); D.voci.push({ id: r.id, ...dati }); }
      S.edit = null; S.fd = null; if (S.exp) S.exp.form = false; await syncStorico(); return render();
    }
    if (a === 'del') {
      if (!confirm('Eliminare questa voce?')) return;
      await deleteDoc(doc(db, 'users', D.uid, 'voci', v));
      D.voci = D.voci.filter(x => x.id !== v); await syncStorico(); return render();
    }
    if (a === 'appr' || a === 'rev') { await updateDoc(doc(db, 'users', v), { approved: a === 'appr' }); await loadUsers(); return render(); }
    if (a === 'rej') { if (!confirm('Rifiutare questa richiesta?')) return; await deleteDoc(doc(db, 'users', v)); await loadUsers(); return render(); }
    if (a === 'reload-users') { await loadUsers(); return render(); }
    if (a === 'view') {
      const u = S.users.find(x => x.uid === v);
      S.own = S.data; await loadData(v, u.nome, true); S.fAcc = 'all'; S.menu = false; S.tab = 'pat'; return render();
    }
    if (a === 'back') { S.data = S.own; S.fAcc = 'all'; S.tab = 'adm'; return render(); }
  } catch (e) { S.msg = errText(e); render(); }
}

const tip = document.createElement('div'); tip.className = 'tip'; document.body.appendChild(tip);
const tipAt = (e, t) => { if (!t) { tip.style.display = 'none'; return; } tip.textContent = t.dataset.tip; tip.style.display = 'block'; const w = tip.offsetWidth; tip.style.left = Math.max(4, Math.min(innerWidth - w - 4, e.clientX + 12)) + 'px'; tip.style.top = (e.clientY + 16) + 'px'; };
document.addEventListener('mousemove', e => tipAt(e, e.target.closest ? e.target.closest('[data-tip]') : null));
document.addEventListener('mouseleave', () => tipAt(null, null));
document.addEventListener('change', async e => {
  if (e.target.id !== 'impf' || !e.target.files[0]) return;
  const D = S.data, box = $('impmsg'); if (!D || D.readonly) return;
  try {
    const txt = await e.target.files[0].text(), mk = monthKey(); let ok = 0, skip = 0, bad = 0;
    for (const ln of txt.split(/\r?\n/)) {
      const p = ln.trim().split(/[;,\t]/).map(x => x.trim()); if (p.length < 3 || !/^\d{4}-\d{2}$/.test(p[0])) continue;
      const at = Number(p[1].replace(',', '.')), pa = Number(p[2].replace(',', '.'));
      if (!isFinite(at) || !isFinite(pa) || at < 0 || pa < 0 || +p[0].slice(5) < 1 || +p[0].slice(5) > 12) { bad++; continue; }
      const ex = D.storico.find(x => x.mese === p[0]);
      if (p[0] >= mk || (ex && !ex.manuale)) { skip++; continue; }
      const dati = { attivi: r2(at), passivi: r2(pa), netto: r2(at - pa) };
      await setDoc(doc(db, 'users', D.uid, 'storico', p[0]), { ...dati, manuale: true, aggiornato: serverTimestamp() });
      if (ex) Object.assign(ex, dati, { manuale: true }); else D.storico.push({ mese: p[0], ...dati, manuale: true });
      ok++;
    }
    D.storico.sort((x, y) => x.mese.localeCompare(y.mese));
    S.msg = `Importati ${ok} mesi.` + (skip ? ` Saltati ${skip} (mese in corso o già registrato dall'app).` : '') + (bad ? ` Righe non valide: ${bad}.` : ''); render();
  } catch (er) { if (box) box.textContent = errText(er); }
});
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && el.tagName !== 'SELECT' && el.tagName !== 'INPUT') act(el); });
document.addEventListener('change', e => { if ((e.target.tagName === 'SELECT' || e.target.type === 'month') && e.target.dataset.act) act(e.target); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if ($('pn') && document.activeElement === $('pn')) act(document.querySelector('[data-act="login"],[data-act="register"]'));
  else if ($('an') && document.activeElement === $('an')) act(document.querySelector('[data-act="adda"]'));
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
