<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>P.Finance</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f1f5f4;color:#16302d;font-size:16px}
header{background:#0f766e;color:#fff;position:sticky;top:0;z-index:5}
.hw{max-width:900px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hw h1{font-size:18px;margin:0;flex:1;white-space:nowrap}
@media(max-width:480px){.un{display:none}}
.un{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
nav{display:flex;gap:6px;max-width:900px;margin:0 auto;padding:0 14px 8px;overflow-x:auto}
nav button{white-space:nowrap;background:transparent;color:#d6f2ee;border:0;padding:8px 14px;border-radius:20px;font-size:15px;cursor:pointer}
nav button.on{background:#fff;color:#0f766e;font-weight:600}
main{max-width:900px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.big{font-size:28px;font-weight:700}
.lbl{font-size:13px;color:#5b7370}
.pos{color:#15803d}.neg{color:#b91c1c}
h2{font-size:17px;margin:0 0 10px}
input,select{width:100%;padding:11px;border:1px solid #c5d5d2;border-radius:10px;font-size:16px;margin:4px 0 10px;background:#fff}
button.b{background:#0f766e;color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:15px;cursor:pointer}
button.b.s{background:#e2eceb;color:#0f766e}
button.b.r{background:#fee2e2;color:#b91c1c}
button.b.sm{padding:6px 10px;font-size:13px}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eef3f2}
.row:last-child{border:0}
.row .n{flex:1;min-width:0}
.row .n small{display:block;color:#5b7370}
.row .v{font-weight:600;white-space:nowrap}
.msg{color:#b91c1c;min-height:20px;font-size:14px}
.ok{color:#15803d}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1}
.auth{max-width:380px;margin:40px auto}
.banner{background:#fef3c7;color:#92400e;border-radius:10px;padding:10px 12px;margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.note{font-size:13px;color:#5b7370;margin-top:8px}
ul.c{padding-left:18px;margin:6px 0}
ul.c li{margin-bottom:8px}
svg{width:100%;height:auto}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:6px 0 10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tw{overflow-x:auto}
.chev{color:#0f766e;font-size:20px;line-height:1;transition:transform .15s;padding:0 4px}
.chev.open{transform:rotate(90deg)}
.sub{margin:0 0 10px 10px;padding-left:10px;border-left:3px solid #9cc9c0;background:rgba(255,255,255,.55);border-radius:0 8px 8px 0}
.sub .row{padding:8px 6px}
.card.at{background:#e9f4f0}.card.pa{background:#fbeded}
.card.at h2{color:#0b5f58}.card.pa h2{color:#9b1c1c}
.card.at .row{border-bottom-color:#d2e5de}.card.pa .row{border-bottom-color:#f0d3d3}
.card.at .row.cl:hover{background:#dcece6}.card.pa .row.cl:hover{background:#f6dede}
.ver{font-size:11px;font-weight:500;background:rgba(255,255,255,.22);padding:2px 7px;border-radius:10px;vertical-align:middle;margin-left:4px}
.auth .ver{background:#d6f2ee;color:#0f766e}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.two .card{margin-bottom:0}
.two .big{font-size:clamp(18px,5.4vw,28px)}
.dot{position:absolute;top:0;right:2px;width:10px;height:10px;border-radius:50%;background:#f87171;border:2px solid #0f766e}
.ham{position:relative;background:transparent;border:0;color:#fff;font-size:26px;cursor:pointer;padding:0 6px;line-height:1}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,85vw);background:#fff;z-index:21;overflow-y:auto;padding:16px;box-shadow:2px 0 12px rgba(0,0,0,.25)}
.it{display:flex;align-items:center;gap:4px;padding:12px;border-radius:10px;cursor:pointer}
.it:hover{background:#eef6f5}.it.on{background:#d6f2ee;font-weight:600}
.it .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ic{background:transparent;border:0;cursor:pointer;font-size:16px;padding:4px 8px;color:#5b7370}
.plus{display:flex;justify-content:center;margin-top:14px}
.plus button{width:50px;height:50px;border-radius:50%;font-size:28px;line-height:1;padding:0}
.pop{position:fixed;z-index:22;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,90vw);background:#fff;border-radius:16px;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.row.cl{cursor:pointer;border-radius:8px}.row.cl:hover{background:#f4faf9}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid #eef3f2;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:#5b7370;font-weight:500}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc, collection, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA6D6lvqErC4rXALCu9Tp_4_iI6fwjjR5k",
  authDomain: "p-finance-app.firebaseapp.com",
  projectId: "p-finance-app",
  storageBucket: "p-finance-app.firebasestorage.app",
  messagingSenderId: "157182448469",
  appId: "1:157182448469:web:bf091bf38a027e004115dc"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const VER = '0.10';
const ADMIN_EMAIL = 'mariot@pfinance.app';
const CATS = {
  attivo: ['Conto corrente', 'Conto di investimento', 'Portafoglio', 'Immobile', 'Altro attivo'],
  passivo: ['Mutuo', 'Prestito', 'Carta di credito', 'Altro debito']
};
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mailOf = n => n.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '') + '@pfinance.app';
const eur = v => new Intl.NumberFormat('it-IT', {style:'currency', currency:'EUR', maximumFractionDigits: 0, useGrouping:'always'}).format(v || 0);
const pct = v => (v >= 0 ? '+' : '') + (v * 100).toFixed(1).replace('.', ',') + '%';
const monthKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
const monthName = k => { const [y, m] = k.split('-'); return MESI[+m - 1] + ' ' + y; };
const totals = voci => {
  const a = voci.filter(v => v.tipo === 'attivo').reduce((s, v) => s + v.valore, 0);
  const p = voci.filter(v => v.tipo === 'passivo').reduce((s, v) => s + v.valore, 0);
  return { attivi: a, passivi: p, netto: a - p };
};
const cls = v => v >= 0 ? 'pos' : 'neg';
const pnum = s => parseFloat(String(s).replace(/\./g, '').replace(',', '.'));
const r2 = v => Math.round(v * 100) / 100;
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtD = s => s.split('-').reverse().join('/');
const addM = (d, k) => { const x = new Date(d.getFullYear(), d.getMonth() + k, 1); const last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate(); x.setDate(Math.min(d.getDate(), last)); return x; };
const cnt = (a, b) => { let k = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()); while (k > 0 && addM(a, k) > b) k--; while (addM(a, k + 1) <= b) k++; return Math.max(0, k); };
/* Piano di rimborso: solo quota capitale, rate mensili uguali dalla data di inizio alla data di fine */
function piano(v, oggi = new Date()) {
  const a = parseD(v.inizio), f = parseD(v.fine), t = new Date(oggi.getFullYear(), oggi.getMonth(), oggi.getDate());
  const N = Math.max(1, cnt(a, f)), rata = r2(v.capitale / N);
  if (t < a) return { N, k: 0, rata, residuo: 0, partito: false };
  const k = Math.min(N, cnt(a, t));
  return { N, k, rata, residuo: r2(v.capitale * (N - k) / N), partito: true };
}
const applyPiano = v => { if (v.piano) v.valore = piano(v).residuo; return v; };
const prevMonth = () => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); return monthKey(d); };

const S = { user: null, profile: null, data: null, tab: 'pat', users: [], edit: null, pendingName: null, loading: true, msg: '' };

function errText(e) {
  const c = e && e.code || '';
  if (c.includes('email-already-in-use')) return 'Questo nome è già registrato.';
  if (c.includes('invalid-credential') || c.includes('user-not-found') || c.includes('wrong-password')) return 'Nome o PIN errati.';
  if (c.includes('weak-password')) return 'Il PIN deve avere 6 cifre.';
  if (c.includes('network')) return 'Connessione assente. Riprova.';
  if (c.includes('too-many-requests')) return 'Troppi tentativi. Riprova tra qualche minuto.';
  if (c.includes('permission-denied')) return 'Permesso negato. Chiedi all\'amministratore.';
  return 'Errore: ' + (c || (e && e.message) || 'sconosciuto');
}

/* ---------- Dati ---------- */
async function loadData(uid, nome, readonly) {
  const [vs, ss, as] = await Promise.all([
    getDocs(collection(db, 'users', uid, 'voci')),
    getDocs(collection(db, 'users', uid, 'storico')),
    getDocs(collection(db, 'users', uid, 'account'))
  ]);
  const accounts = as.docs.map(d => ({ id: d.id, nome: d.data().nome })).sort((a, b) => a.nome.localeCompare(b.nome));
  const voci = vs.docs.map(d => applyPiano({ id: d.id, ...d.data() }));
  const storico = ss.docs.map(d => ({ mese: d.id, ...d.data() })).sort((a, b) => a.mese.localeCompare(b.mese));
  S.data = { uid, nome, readonly, voci, storico, accounts };
  if (!readonly) await syncStorico();
}

async function syncStorico() {
  const D = S.data;
  if (!D || D.readonly) return;
  const t = totals(D.voci);
  const mk = monthKey();
  const cur = D.storico.find(x => x.mese === mk);
  if (!D.voci.length && !cur) return;
  if (cur && cur.attivi === t.attivi && cur.passivi === t.passivi) return;
  await setDoc(doc(db, 'users', D.uid, 'storico', mk), { ...t, aggiornato: serverTimestamp() });
  if (cur) Object.assign(cur, t); else { D.storico.push({ mese: mk, ...t }); D.storico.sort((a, b) => a.mese.localeCompare(b.mese)); }
}

async function loadUsers() {
  const q = await getDocs(collection(db, 'users'));
  S.users = q.docs.map(d => ({ uid: d.id, ...d.data() })).filter(u => u.uid !== S.user.uid)
    .sort((a, b) => (a.approved === b.approved ? (a.nome || '').localeCompare(b.nome || '') : a.approved ? 1 : -1));
}

/* ---------- Accesso ---------- */
onAuthStateChanged(auth, async user => {
  S.user = user; S.msg = '';
  if (!user) { S.profile = null; S.data = null; S.loading = false; return render(); }
  S.loading = true; render();
  try {
    const ref = doc(db, 'users', user.uid);
    let snap = await getDoc(ref);
    if (!snap.exists()) {
      const nome = S.pendingName || user.email.split('@')[0];
      await setDoc(ref, { nome, approved: false, creato: serverTimestamp() });
      snap = await getDoc(ref);
    }
    S.profile = snap.data();
    if (user.email === ADMIN_EMAIL && !S.profile.approved) {
      await updateDoc(ref, { approved: true });
      S.profile.approved = true;
    }
    if (S.profile.approved) {
      await loadData(user.uid, S.profile.nome, false);
      if (isAdmin()) await loadUsers();
    }
  } catch (e) { S.msg = errText(e); }
  S.loading = false; render();
});
const isAdmin = () => S.user && S.user.email === ADMIN_EMAIL;

/* ---------- Schermate ---------- */
function render() {
  const el = $('app');
  if (S.loading) { el.innerHTML = '<div class="auth card">Caricamento…</div>'; return; }
  if (!S.user) return renderAuth(el);
  if (!S.profile || !S.profile.approved) {
    el.innerHTML = `<div class="auth card"><h2>Registrazione ricevuta</h2>
      <p>Ciao ${esc(S.profile?.nome || '')}. Attendi l'approvazione dell'amministratore.</p>
      <div class="msg">${esc(S.msg)}</div>
      <div class="acts"><button class="b" data-act="refresh">Controlla di nuovo</button><button class="b s" data-act="logout">Esci</button></div></div>`;
    return;
  }
  const D = S.data;
  const tabs = [['pat', 'Patrimonio'], ['dis', 'Distribuzione'], ['and', 'Andamento'], ['rep', 'Report del mese']];
  const pend = isAdmin() && !D.readonly ? S.users.filter(u => !u.approved).length : 0;
  if (S.tab === 'adm' && !(isAdmin() && !D.readonly)) S.tab = 'pat';
  let body = '';
  if (S.tab === 'pat') body = pagePat(); else if (S.tab === 'dis') body = pageDis(); else if (S.tab === 'and') body = pageAnd(); else if (S.tab === 'rep') body = pageRep(); else body = pageAdm();
  el.innerHTML = `<header><div class="hw"><button class="ham" data-act="menu" aria-label="Menu">☰${pend ? '<i class="dot"></i>' : ''}</button><h1>P.Finance <span class="ver">v${VER} beta</span></h1><span class="un">${esc(S.profile.nome)}</span>
    <button class="b s sm" data-act="share">Condividi</button><button class="b s sm" data-act="logout">Esci</button></div>
    <nav>${tabs.map(([k, l]) => `<button data-act="tab" data-v="${k}" class="${S.tab === k ? 'on' : ''}">${l}</button>`).join('')}</nav></header>
    <main>${D.readonly ? `<div class="banner"><span>Stai vedendo i dati di <b>${esc(D.nome)}</b> (sola lettura)</span><button class="b sm" data-act="back">Torna ai miei</button></div>` : ''}
    <div class="msg ${/salvato\.$|aggiunto\.$|aggiornato\.$|^Link copiato/.test(S.msg) ? 'ok' : ''}">${esc(S.msg)}</div>${body}</main>${S.menu ? drawer() : ''}${S.pop ? popup() : ''}`;
}

function renderAuth(el) {
  const reg = S.mode === 'reg';
  el.innerHTML = `<div class="auth card"><h2>P.Finance <span class="ver">v${VER} beta</span></h2>
    <div class="tabs"><button class="b ${reg ? 's' : ''}" data-act="mode" data-v="login">Accedi</button>
    <button class="b ${reg ? '' : 's'}" data-act="mode" data-v="reg">Registrati</button></div>
    <label class="lbl">Nome</label><input id="nm" autocomplete="username" autocapitalize="words">
    <label class="lbl">PIN (6 cifre)</label><input id="pn" type="password" inputmode="numeric" maxlength="6" autocomplete="${reg ? 'new-password' : 'current-password'}">
    <div class="msg" id="am">${esc(S.msg)}</div>
    <button class="b" style="width:100%" data-act="${reg ? 'register' : 'login'}">${reg ? 'Crea account' : 'Entra'}</button>
    ${reg ? '<p class="note">Dopo la registrazione l\'amministratore dovrà approvarti.</p>' : ''}</div>`;
}

const contoName = v => { const c = S.data.voci.find(x => x.id === v.conto); return c ? c.nome : '—'; };
const accKey = v => v.account || 'main';
const accName = v => { const D = S.data; if (!v.account) return D.nome; const a = D.accounts.find(x => x.id === v.account); return a ? a.nome : '(account eliminato)'; };

function pagePat() {
  const D = S.data, fa = S.fAcc || 'all', ed = S.edit && D.voci.find(v => v.id === S.edit);
  const vis = D.voci.filter(v => fa === 'all' || accKey(v) === fa), t = totals(vis);
  const g = (id, d) => (S.fd && S.fd[id] !== undefined) ? S.fd[id] : d;
  const tipo = g('ft', ed ? ed.tipo : 'attivo');
  const mod = tipo === 'passivo' ? g('fm', ed ? (ed.piano ? 'piano' : 'manuale') : 'piano') : 'manuale';
  const det = v => v.piano ? ` · ${eur(piano(v).rata)}/mese · fino al ${fmtD(v.fine)}`
    : v.categoria === 'Portafoglio' ? ` · in ${esc(contoName(v))}${v.obiettivo ? ` · obiettivo ${eur(v.obiettivo)} (${Math.round(v.valore / v.obiettivo * 100)}%)` : ''}` : '';
  const cat = g('fc', ed ? ed.categoria : CATS[tipo][0]);
  const isPf = tipo === 'attivo' && cat === 'Portafoglio';
  const conti = D.voci.filter(v => v.tipo === 'attivo' && (v.categoria === 'Conto corrente' || v.categoria === 'Conto di investimento'));
  const contoSel = g('fcn', ed && ed.conto ? ed.conto : (conti.length ? conti[0].id : 'new'));
  const pfCampi = isPf ? `<label class="lbl">Dove si trova il portafoglio?</label><select id="fcn" data-act="fcat">${conti.map(c => `<option value="${c.id}" ${contoSel === c.id ? 'selected' : ''}>${esc(c.nome)} (conto già aperto)</option>`).join('')}<option value="new" ${contoSel === 'new' ? 'selected' : ''}>+ Nuovo conto</option></select>
    ${contoSel === 'new' ? `<label class="lbl">Nome del nuovo conto</label><input id="fcm" maxlength="60" value="${esc(g('fcm', ''))}">` : ''}` : '';
  const obj = isPf ? `<label class="lbl">Obiettivo in euro (facoltativo)</label><input id="fo" inputmode="decimal" value="${esc(g('fo', ed && ed.obiettivo ? String(ed.obiettivo).replace('.', ',') : ''))}">
    <p class="note" style="margin-top:0">Il portafoglio si somma alla liquidità del conto: nel conto inserisci solo il saldo liquido.</p>` : '';
  const accOpts = [['main', D.nome], ...D.accounts.map(a => [a.id, a.nome])];
  const kids = {};
  vis.filter(v => v.tipo === 'attivo' && v.categoria === 'Portafoglio' && v.conto && vis.some(c => c.id === v.conto)).forEach(pf => (kids[pf.conto] = kids[pf.conto] || []).push(pf));
  const nested = new Set(Object.values(kids).flat().map(x => x.id));
  const tot = v => v.valore + (kids[v.id] || []).reduce((s, x) => s + x.valore, 0);
  const acc = v => D.accounts.length ? ' · ' + esc(accName(v)) : '';
  const clk = id => D.readonly ? '' : ` data-act="pop" data-v="${id}"`;
  const rcl = D.readonly ? '' : ' cl';
  const list = tp => {
    const items = vis.filter(v => v.tipo === tp && !nested.has(v.id)).sort((a, b) => tot(b) - tot(a));
    if (!items.length) return '<p class="note">Nessuna voce.</p>';
    const hint = items.some(v => kids[v.id]) ? '<p class="note" style="margin:-4px 0 6px">▸ Le righe con la freccia si espandono: tocca per vedere liquidità e portafogli.</p>' : '';
    return hint + items.map(v => {
      const k = kids[v.id];
      if (!k) return `<div class="row${rcl}"${clk(v.id)}><div class="n">${esc(v.nome)}<small>${esc(v.categoria)}${det(v)}${acc(v)}</small></div><div class="v${tp === 'passivo' ? ' neg' : ''}">${eur(v.valore)}</div></div>`;
      const open = S.exp && S.exp[v.id];
      const sub = open ? `<div class="sub"><div class="row${rcl}"${clk(v.id)}><div class="n">Liquidità<small>Saldo del conto</small></div><div class="v">${eur(v.valore)}</div></div>`
        + k.map(pf => `<div class="row${rcl}"${clk(pf.id)}><div class="n">${esc(pf.nome)}<small>Portafoglio${pf.obiettivo ? ` · obiettivo ${eur(pf.obiettivo)} (${Math.round(pf.valore / pf.obiettivo * 100)}%)` : ''}</small></div><div class="v">${eur(pf.valore)}</div></div>`).join('') + '</div>' : '';
      return `<div class="row cl" data-act="exp" data-v="${v.id}"><div class="n">${esc(v.nome)}<small>${esc(v.categoria)} · liquidità + ${k.length} ${k.length === 1 ? 'portafoglio' : 'portafogli'}${acc(v)}</small></div><div class="v">${eur(tot(v))}</div><span class="chev ${open ? 'open' : ''}">▸︎</span></div>${sub}`;
    }).join('');
  };
  const fname = fa === 'all' ? '' : fa === 'main' ? D.nome : ((D.accounts.find(a => a.id === fa) || {}).nome || '');
  const filtro = fname ? `<div class="banner"><span>Account: <b>${esc(fname)}</b></span><button class="b sm" data-act="facc" data-v="all">Mostra tutti</button></div>` : '';
  const selAcc = D.accounts.length ? `<label class="lbl">Account</label><select id="fa">${accOpts.map(([k, n]) => `<option value="${esc(k)}" ${g('fa', ed ? accKey(ed) : (fa !== 'all' ? fa : 'main')) === k ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>` : '';
  const campi = mod === 'piano'
    ? `<label class="lbl">Importo preso a prestito (€)</label><input id="fk" inputmode="decimal" value="${esc(g('fk', ed && ed.piano ? String(ed.capitale).replace('.', ',') : ''))}">
    <label class="lbl">Data di inizio</label><input id="fi" type="date" value="${esc(g('fi', ed && ed.piano ? ed.inizio : ''))}">
    <label class="lbl">Data di fine</label><input id="ff" type="date" value="${esc(g('ff', ed && ed.piano ? ed.fine : ''))}">
    <p class="note" style="margin-top:0">Il debito residuo scende da solo ogni mese della sola quota capitale (importo diviso per i mesi). Gli interessi sono un costo e non vengono considerati.</p>`
    : `<label class="lbl">${tipo === 'attivo' && cat === 'Conto di investimento' ? 'Liquidità del conto in euro' : tipo === 'attivo' && cat === 'Conto corrente' ? 'Saldo in euro' : 'Valore in euro'}</label><input id="fv" inputmode="decimal" value="${esc(g('fv', ed && !ed.piano ? String(ed.valore).replace('.', ',') : ''))}">${tipo === 'attivo' && cat === 'Conto di investimento' ? '<p class="note" style="margin-top:0">Inserisci solo la liquidità (il saldo non investito). I portafogli del conto si aggiungono a parte con la categoria Portafoglio e vengono sommati in automatico.</p>' : ''}`;
  const selMod = tipo === 'passivo' ? `<label class="lbl">Come vuoi inserire il debito?</label><select id="fm" data-act="fmod"><option value="piano" ${mod === 'piano' ? 'selected' : ''}>Piano di rimborso (calcolo automatico)</option><option value="manuale" ${mod === 'manuale' ? 'selected' : ''}>Residuo inserito a mano</option></select>` : '';
  const form = D.readonly ? '' : `<div class="card" id="formvoce"><h2>${ed ? 'Modifica voce' : 'Nuova voce'}</h2>
    <label class="lbl">Tipo</label><select id="ft" data-act="ftipo"><option value="attivo" ${tipo === 'attivo' ? 'selected' : ''}>Attivo (ciò che possiedi)</option><option value="passivo" ${tipo === 'passivo' ? 'selected' : ''}>Passivo (ciò che devi)</option></select>
    ${selAcc}
    <label class="lbl">Categoria</label><select id="fc" data-act="fcat">${CATS[tipo].map(c => `<option ${g('fc', ed ? ed.categoria : '') === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
    ${pfCampi}
    ${selMod}
    <label class="lbl">Nome (es. Conto Fineco, Mutuo casa)</label><input id="fn" maxlength="60" value="${esc(g('fn', ed ? ed.nome : ''))}">
    ${campi}
    ${obj}
    <div class="acts"><button class="b" data-act="save">${ed ? 'Salva modifica' : 'Aggiungi'}</button>${ed ? '<button class="b s" data-act="cancel">Annulla</button>' : ''}</div></div>`;
  return `${filtro}<div class="card"><div class="lbl">Patrimonio netto</div><div class="big ${cls(t.netto)}">${eur(t.netto)}</div></div>
    <div class="two"><div class="card at"><div class="lbl">Attivi</div><div class="big">${eur(t.attivi)}</div></div>
    <div class="card pa"><div class="lbl">Passivi</div><div class="big neg">${eur(t.passivi)}</div></div></div>
    <div class="card at"><h2>Attivi</h2>${list('attivo')}</div>
    <div class="card pa"><h2>Passivi</h2>${list('passivo')}</div>
    ${form}
    <div class="card"><h2>Esporta</h2><button class="b" data-act="export">Scarica i dati (CSV per Excel)</button></div>`;
}

function drawer() {
  const D = S.data, fa = S.fAcc || 'all', ro = D.readonly;
  const item = (k, n, sub, extra) => `<div class="it ${fa === k ? 'on' : ''}" data-act="facc" data-v="${esc(k)}"><span class="t">${esc(n)}${sub ? `<small class="lbl" style="display:block;font-weight:400">${sub}</small>` : ''}</span>${extra || ''}</div>`;

  const add = ro ? '' : (S.addAcc
    ? `<div style="margin-top:14px"><input id="an" maxlength="30" placeholder="Nome (es. Anna)"><div class="acts"><button class="b" data-act="adda">Aggiungi</button><button class="b s" data-act="addc">Annulla</button></div></div>`

  return `<div class="ov" data-act="menu"></div><div class="drawer"><h2>Account</h2>${item('all', 'Tutti gli account')}${item('main', D.nome, 'Principale')}${rows}<div class="msg">${esc(S.msg)}</div>${add}${adm}</div>`;
}

function popup() {
  const D = S.data, p = S.pop, v = D.voci.find(x => x.id === p.id);
  if (!v) return '';
  let body;
  const pi = v.piano ? piano(v) : null;
  const pf = v.categoria === 'Portafoglio' ? `<div class="lbl" style="margin:-6px 0 12px">In: ${esc(contoName(v))}${v.obiettivo ? ` · Obiettivo ${eur(v.obiettivo)} · raggiunto ${Math.round(v.valore / v.obiettivo * 100)}%</div><div style="height:8px;background:#e2eceb;border-radius:6px;margin-bottom:12px"><div style="height:100%;width:${Math.min(100, v.valore / v.obiettivo * 100)}%;background:#0f766e;border-radius:6px"></div>` : ''}</div>` : '';
  if (p.mode === 'upd') body = `<label class="lbl">${v.categoria === 'Conto di investimento' ? 'Nuova liquidità in euro' : 'Nuovo valore in euro'}</label><input id="pv" inputmode="decimal" value="${String(v.valore).replace('.', ',')}"><div class="acts"><button class="b" data-act="updsave">Salva</button><button class="b s" data-act="popback">Indietro</button></div>`;
  else if (p.mode === 'del') body = `<p style="margin-top:0">Vuoi davvero eliminare <b>${esc(v.nome)}</b>?</p><div class="acts"><button class="b r" data-act="delok">Sì, elimina</button><button class="b s" data-act="popback">Annulla</button></div>`;
  else body = `<div class="acts" style="flex-direction:column">${v.piano ? '' : '<button class="b" data-act="popupd">Aggiorna</button>'}<button class="b s" data-act="popedit">Modifica</button><button class="b r" data-act="popdel">Elimina</button><button class="b s" data-act="popclose">Chiudi</button></div>`;
  return `<div class="ov" data-act="popclose"></div><div class="pop"><h2 style="margin-bottom:2px">${esc(v.nome)}</h2><div class="lbl" style="margin-bottom:12px">${esc(v.categoria)} · ${esc(accName(v))} · ${eur(v.valore)}</div>${pi ? `<div class="lbl" style="margin:-6px 0 12px">Prestito di ${eur(v.capitale)} · rata capitale ${eur(pi.rata)}/mese · pagate ${pi.k} su ${pi.N} · fine ${fmtD(v.fine)}${pi.partito ? '' : ' · non ancora iniziato'}</div>` : ''}${pf}<div class="msg">${esc(S.msg)}</div>${body}</div>`;
}

const eur0 = v => new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0, useGrouping: 'always' }).format(v || 0);
const trunc = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;

function treeSvg(root, branches) {
  const colW = 176, nw = 160, nh = 46, lh = 52, rootY = 4, rootH = 62, b1Y = 112, b1H = 50, gY = 218, leafY0 = gY + nh + 14;
  const cols = branches.reduce((s, b) => s + b.groups.length, 0), W = Math.max(cols * colW, 360), off = (W - cols * colW) / 2, mid = W / 2;
  const maxL = Math.max(1, ...branches.flatMap(b => b.groups.map(g => g.items.length))), H = leafY0 + maxL * lh + 6;
  const TONE = { a: { st: '#0f766e', fill: '#d6f2ee', ln: '#4f9f96', leaf: '#b5d9d4', tx: '#16302d' }, p: { st: '#b91c1c', fill: '#fde8e8', ln: '#d96464', leaf: '#efb0b0', tx: '#b91c1c' } };
  const T = (x, y, s, sz, w, f, an = 'middle') => `<text x="${x}" y="${y}" font-size="${sz}" font-weight="${w}" fill="${f}" text-anchor="${an}">${esc(s)}</text>`;
  let o = '', col = 0;
  branches.forEach(b => {
    const c = TONE[b.tone], first = off + col * colW + colW / 2, last = off + (col + b.groups.length - 1) * colW + colW / 2, bx = (first + last) / 2;
    const m1 = (rootY + rootH + b1Y) / 2, m2 = (b1Y + b1H + gY) / 2;
    o += `<path d="M${mid} ${rootY + rootH} C${mid} ${m1} ${bx} ${m1} ${bx} ${b1Y}" fill="none" stroke="${c.ln}" stroke-width="3"/>`;
    b.groups.forEach((g, i) => {
      const x = off + (col + i) * colW + colW / 2, gx = x - nw / 2, rail = gx + 12, lx = rail + 12, lw = gx + nw - lx;
      o += `<path d="M${bx} ${b1Y + b1H} C${bx} ${m2} ${x} ${m2} ${x} ${gY}" fill="none" stroke="${c.ln}" stroke-width="2.5"/>`;
      o += `<rect x="${gx}" y="${gY}" width="${nw}" height="${nh}" rx="10" fill="${c.fill}" stroke="${c.st}" stroke-width="1.8"/>` + T(x, gY + 19, trunc(g.label, 20), 13, 600, '#16302d') + T(x, gY + 36, eur0(g.sum) + (g.pct ? ' · ' + g.pct : ''), 12, 600, c.tx);
      if (g.items.length) o += `<line x1="${rail}" x2="${rail}" y1="${gY + nh}" y2="${leafY0 + (g.items.length - 1) * lh + 23}" stroke="${c.ln}" stroke-width="2"/>`;
      g.items.forEach((it, j) => {
        const y = leafY0 + j * lh;
        o += `<line x1="${rail}" x2="${lx}" y1="${y + 23}" y2="${y + 23}" stroke="${c.ln}" stroke-width="2"/><g><title>${esc(it.nome + ' · ' + it.sub + ' · ' + eur(it.val))}</title>`
          + `<rect x="${lx}" y="${y}" width="${lw}" height="${lh - 6}" rx="8" fill="#fff" stroke="${c.leaf}" stroke-width="1.5"/>`
          + T(lx + 8, y + 15, trunc(it.nome, 17), 12, 600, '#16302d', 'start') + T(lx + 8, y + 28, trunc(it.sub, 20), 10.5, 400, '#5b7370', 'start')
          + T(lx + 8, y + 41, eur0(it.val) + (it.pct ? ' · ' + it.pct : ''), 11, 600, c.tx, 'start') + '</g>';
      });
    });
    o += `<rect x="${bx - 90}" y="${b1Y}" width="180" height="${b1H}" rx="12" fill="${c.fill}" stroke="${c.st}" stroke-width="2.5"/>` + T(bx, b1Y + 21, b.label, 14, 700, c.st) + T(bx, b1Y + 40, eur0(b.sum), 14, 700, c.tx);
    col += b.groups.length;
  });
  o += `<rect x="${mid - 110}" y="${rootY}" width="220" height="${rootH}" rx="12" fill="#1f3b38"/>` + T(mid, rootY + 21, 'Patrimonio netto', 13, 600, '#d6f2ee') + T(mid, rootY + 42, eur0(root.netto), 16, 700, '#fff') + T(mid, rootY + 56, 'Attivi ' + eur0(root.attivi) + ' − Passivi ' + eur0(root.passivi), 10, 500, '#b5d9d4');
  return `<div class="tw"><svg viewBox="0 0 ${W} ${H}" style="min-width:${W}px">${o}</svg></div>`;
}

function pageDis() {
  const D = S.data, view = S.dview || 'acc';
  const ctl = `<div class="card"><div class="tabs"><button class="b ${view === 'acc' ? '' : 's'}" data-act="dview" data-v="acc">Per account</button><button class="b ${view === 'conti' ? '' : 's'}" data-act="dview" data-v="conti">Per conti</button></div>
    <div class="legend" style="margin:0"><span><i style="background:#0f766e"></i>Attivi</span><span><i style="background:#b91c1c"></i>Passivi</span></div></div>`;
  if (!D.voci.length) return ctl + '<div class="card">Nessuna voce da mostrare. Inseriscile nella pagina Patrimonio.</div>';
  const build = tp => {
    const vs = D.voci.filter(v => v.tipo === tp);
    if (!vs.length) return null;
    const total = vs.reduce((s, v) => s + v.valore, 0), G = {};
    vs.forEach(v => {
      const k = view === 'acc' ? accKey(v) : v.categoria;
      const g = G[k] = G[k] || { label: view === 'acc' ? accName(v) : v.categoria, items: [], sum: 0 };
      g.items.push({ nome: v.categoria === 'Conto di investimento' && D.voci.some(z => z.conto === v.id) ? v.nome + ' (liquidità)' : v.nome, val: v.valore, sub: v.categoria === 'Portafoglio' ? 'in ' + contoName(v) : (view === 'acc' ? v.categoria : accName(v)) });
      g.sum += v.valore;
    });
    const share = x => total > 0 ? (x / total * 100).toFixed(1).replace('.', ',') + '%' : '';
    const groups = Object.values(G).sort((a, b) => b.sum - a.sum);
    groups.forEach(g => { g.items.sort((a, b) => b.val - a.val); g.items.forEach(i => i.pct = share(i.val)); g.pct = share(g.sum); });
    return { label: tp === 'attivo' ? 'Attivi' : 'Passivi', tone: tp === 'attivo' ? 'a' : 'p', sum: total, groups };
  };
  const br = ['attivo', 'passivo'].map(build).filter(Boolean);
  return ctl + `<div class="card"><h2>Distribuzione ${view === 'acc' ? 'per account' : 'per conti'}</h2>${treeSvg(totals(D.voci), br)}
    <p class="note">Ramo verde: attivi. Ramo rosso: passivi. Le percentuali sono sul totale del proprio ramo. Scorri di lato se i rami sono molti.</p></div>`;
}

function trendSvg(st) {
  if (st.length < 2) return '';
  const W = 600, H = 160, P = 28, vals = st.map(s => s.netto);
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = (mx - mn) || 1;
  const x = i => P + i * (W - 2 * P) / (st.length - 1), y = v => H - P - (v - mn) / rg * (H - 2 * P);
  const pts = st.map((s, i) => `${x(i).toFixed(1)},${y(s.netto).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}"><polyline points="${pts}" fill="none" stroke="#0f766e" stroke-width="3"/>
    ${st.map((s, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(s.netto).toFixed(1)}" r="4" fill="#0f766e"/>`).join('')}
    <text x="${P}" y="${H - 6}" font-size="12" fill="#5b7370">${esc(monthName(st[0].mese))}</text>
    <text x="${W - P}" y="${H - 6}" font-size="12" fill="#5b7370" text-anchor="end">${esc(monthName(st[st.length - 1].mese))}</text></svg>`;
}

const compact = v => new Intl.NumberFormat('it-IT', { notation: 'compact', maximumFractionDigits: 1 }).format(v);
const shortM = k => { const [y, m] = k.split('-'); return MESI[+m - 1].slice(0, 3) + ' ' + y.slice(2); };

function lineSvg(st, series) {
  const W = 600, H = 220, L = 50, R = 12, T = 12, B = 28;
  const all = st.flatMap(s => series.map(x => s[x.k]));
  let mn = Math.min(0, ...all), mx = Math.max(0, ...all); if (mx === mn) mx = mn + 1;
  const x = i => L + i * (W - L - R) / (st.length - 1), y = v => T + (mx - v) / (mx - mn) * (H - T - B);
  const step = Math.ceil(st.length / 6);
  let o = [mn, (mn + mx) / 2, mx].map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="#e2eceb"/><text x="${L - 6}" y="${(y(t) + 4).toFixed(1)}" font-size="11" fill="#5b7370" text-anchor="end">${compact(t)}</text>`).join('');
  o += st.map((s, i) => i % step === 0 || i === st.length - 1 ? `<text x="${x(i).toFixed(1)}" y="${H - 8}" font-size="11" fill="#5b7370" text-anchor="middle">${shortM(s.mese)}</text>` : '').join('');
  series.forEach(se => {
    o += `<polyline points="${st.map((s, i) => x(i).toFixed(1) + ',' + y(s[se.k]).toFixed(1)).join(' ')}" fill="none" stroke="${se.c}" stroke-width="2.5"/>`;
    if (st.length <= 18) o += st.map((s, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(s[se.k]).toFixed(1)}" r="3.5" fill="${se.c}"/>`).join('');
  });
  return `<svg viewBox="0 0 ${W} ${H}">${o}</svg>`;
}

function barSvg(st) {
  const d = st.slice(1).map((s, i) => ({ m: s.mese, v: s.netto - st[i].netto }));
  const W = 600, H = 190, L = 50, R = 12, T = 12, B = 28, mid = T + (H - T - B) / 2, half = (H - T - B) / 2;
  const mx = Math.max(1, ...d.map(z => Math.abs(z.v))), slot = (W - L - R) / d.length, bw = Math.min(40, slot * 0.6), step = Math.ceil(d.length / 6);
  let o = [mx, 0, -mx].map(t => `<line x1="${L}" x2="${W - R}" y1="${(mid - t / mx * half).toFixed(1)}" y2="${(mid - t / mx * half).toFixed(1)}" stroke="${t === 0 ? '#9db3af' : '#e2eceb'}"/><text x="${L - 6}" y="${(mid - t / mx * half + 4).toFixed(1)}" font-size="11" fill="#5b7370" text-anchor="end">${compact(t)}</text>`).join('');
  d.forEach((z, i) => {
    const cx = L + slot * (i + 0.5), h = Math.abs(z.v) / mx * half;
    o += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${(z.v >= 0 ? mid - h : mid).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h, 1).toFixed(1)}" rx="3" fill="${z.v >= 0 ? '#15803d' : '#b91c1c'}"/>`;
    if (i % step === 0 || i === d.length - 1) o += `<text x="${cx.toFixed(1)}" y="${H - 8}" font-size="11" fill="#5b7370" text-anchor="middle">${shortM(z.m)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}">${o}</svg>`;
}

function formMese() {
  const D = S.data; if (D.readonly) return '';
  const e = S.editM && D.storico.find(x => x.mese === S.editM), dr = S.draft || {};
  const f = v => String(v).replace('.', ',');
  return `<div class="card"><h2>${e ? 'Modifica mese' : 'Ricostruisci lo storico'}</h2>
    <p class="note" style="margin-top:0">Inserisci i totali di un mese passato. Ripeti per ogni mese che vuoi aggiungere.</p>
    <label class="lbl">Mese (formato AAAA-MM, es. 2026-03)</label><input id="mm" type="month" placeholder="AAAA-MM" max="${prevMonth()}" value="${esc(e ? e.mese : dr.mm || '')}" ${e ? 'readonly' : ''}>
    <label class="lbl">Totale attivi (€)</label><input id="ma" inputmode="decimal" value="${esc(e ? f(e.attivi) : dr.ma || '')}">
    <label class="lbl">Totale passivi (€)</label><input id="mp" inputmode="decimal" value="${esc(e ? f(e.passivi) : dr.mp || '')}">
    <div class="acts"><button class="b" data-act="savem">Salva mese</button>${e ? '<button class="b s" data-act="cancelm">Annulla</button>' : ''}</div></div>`;
}

function pageAnd() {
  const all = S.data.storico, r = S.range ?? 12, ro = S.data.readonly;
  if (!all.length) return formMese() + '<div class="card">Nessuno storico disponibile. Inserisci i mesi passati qui sopra, oppure aggiungi le voci nella pagina Patrimonio: ogni mese ne viene salvata una fotografia.</div>';
  const st = r ? all.slice(-r) : all;
  const sel = `<select data-act="range">${[[6, 'Ultimi 6 mesi'], [12, 'Ultimi 12 mesi'], [0, 'Tutto lo storico']].map(([v, l]) => `<option value="${v}" ${r === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  const L = [{ k: 'attivi', c: '#0f766e', l: 'Attivi' }, { k: 'passivi', c: '#b91c1c', l: 'Passivi' }, { k: 'netto', c: '#1d4ed8', l: 'Patrimonio netto' }];
  const rows = st.map((s, i) => { const p = i ? st[i - 1] : null, d = p ? s.netto - p.netto : null; return { s, d }; }).reverse();
  return `${formMese()}<div class="card">${sel}${st.length < 2 ? '<p class="note">I grafici compariranno quando ci saranno almeno 2 mesi di dati. Ogni mese viene salvata una fotografia del tuo patrimonio quando apri l\'app.</p>' : `
    <h2>Attivi, passivi e patrimonio netto</h2>
    <div class="legend">${L.map(x => `<span><i style="background:${x.c}"></i>${x.l}</span>`).join('')}</div>${lineSvg(st, L)}`}</div>
    ${st.length > 1 ? `<div class="card"><h2>Variazione mensile del patrimonio netto</h2><div class="legend"><span><i style="background:#15803d"></i>Aumento</span><span><i style="background:#b91c1c"></i>Calo</span></div>${barSvg(st)}</div>` : ''}
    <div class="card"><h2>Storico mese per mese</h2><div class="tw"><table><tr><th>Mese</th><th>Attivi</th><th>Passivi</th><th>Netto</th><th>Var.</th>${ro ? '' : '<th></th>'}</tr>
    ${rows.map(({ s, d }) => `<tr><td>${esc(shortM(s.mese))}${s.manuale ? ' ✎' : ''}</td><td>${eur(s.attivi)}</td><td>${eur(s.passivi)}</td><td><b>${eur(s.netto)}</b></td><td class="${d === null ? '' : cls(d)}">${d === null ? '–' : (d >= 0 ? '+' : '') + eur(d)}</td>${ro ? '' : `<td>${s.mese < monthKey() ? `<button class="b s sm" data-act="editm" data-v="${s.mese}">Modifica</button> <button class="b r sm" data-act="delm" data-v="${s.mese}">✕</button>` : ''}</td>`}</tr>`).join('')}</table></div></div>`;
}

function pageRep() {
  const D = S.data, st = D.storico;
  if (!st.length) return '<div class="card">Nessun dato disponibile. Inserisci almeno una voce nella pagina Patrimonio.</div>';
  const cur = st[st.length - 1], prev = st.length > 1 ? st[st.length - 2] : null;
  const dN = prev ? cur.netto - prev.netto : null, dA = prev ? cur.attivi - prev.attivi : null, dP = prev ? cur.passivi - prev.passivi : null;
  const dpct = prev && prev.netto ? dN / Math.abs(prev.netto) : null;
  const byCat = tp => {
    const m = {}; D.voci.filter(v => v.tipo === tp).forEach(v => m[v.categoria] = (m[v.categoria] || 0) + v.valore);
    const e = Object.entries(m).sort((a, b) => b[1] - a[1]);
    return e.length ? e.map(([c, v]) => `<div class="row"><div class="n">${esc(c)}</div><div class="v">${eur(v)}</div></div>`).join('') : '<p class="note">Nessuna voce.</p>';
  };
  const dl = (l, v) => v === null ? '' : `<div class="row"><div class="n">${l}</div><div class="v ${l === 'Passivi' ? cls(-v) : cls(v)}">${v >= 0 ? '+' : ''}${eur(v)}</div></div>`;
  // commenti educativi
  const c = [];
  c.push('Il <b>patrimonio netto</b> è ciò che possiedi meno ciò che devi: è il numero più importante da seguire nel tempo.');
  if (dN !== null) c.push(dN >= 0
    ? `Nel mese il patrimonio netto è <b>aumentato</b> di ${eur(dN)}. Può dipendere da risparmio, rimborso di debiti o variazione dei valori.`
    : `Nel mese il patrimonio netto è <b>diminuito</b> di ${eur(-dN)}. Può dipendere da spese, nuovi debiti o variazione dei valori.`);
  if (cur.attivi > 0) {
    const r = cur.passivi / cur.attivi;
    c.push(`I debiti sono il <b>${(r * 100).toFixed(0)}%</b> di ciò che possiedi. ` + (r < 0.3 ? 'Come regola generale è un livello contenuto.' : r < 0.6 ? 'Come regola generale è un livello medio: conviene tenere d\'occhio le rate.' : 'Come regola generale è un livello alto: le rate pesano molto sul patrimonio.'));
    const liq = D.voci.filter(v => v.categoria === 'Conto corrente').reduce((s, v) => s + v.valore, 0) / cur.attivi;
    if (liq > 0.5) c.push('Oltre metà dei tuoi attivi è sui conti correnti: nel tempo l\'inflazione ne riduce il valore reale.');
    else if (liq < 0.05) c.push('Hai poca liquidità: di solito si consiglia un fondo per imprevisti pari a 3-6 mesi di spese.');
    const top = Math.max(0, ...D.voci.filter(v => v.tipo === 'attivo').map(v => v.valore)) / cur.attivi;
    if (top > 0.6) c.push('Una sola voce vale oltre il 60% dei tuoi attivi: avere tutto in un solo posto aumenta il rischio.');
  }
  return `<div class="card"><h2>Report di ${esc(monthName(cur.mese))}</h2>
    <div class="grid"><div><div class="lbl">Patrimonio netto</div><div class="big ${cls(cur.netto)}">${eur(cur.netto)}</div></div>
    ${dN !== null ? `<div><div class="lbl">Rispetto a ${esc(monthName(prev.mese))}</div><div class="big ${cls(dN)}">${dN >= 0 ? '+' : ''}${eur(dN)}</div>${dpct !== null ? `<div class="lbl">${pct(dpct)}</div>` : ''}</div>` : ''}</div>
    ${dN !== null ? `<div style="margin-top:12px">${dl('Attivi', dA)}${dl('Passivi', dP)}</div>` : '<p class="note">Il confronto con il mese precedente sarà disponibile dal prossimo mese.</p>'}</div>
    ${st.length > 1 ? `<div class="card"><h2>Andamento</h2>${trendSvg(st)}</div>` : ''}
    <div class="grid"><div class="card"><h2>Attivi per categoria</h2>${byCat('attivo')}</div><div class="card"><h2>Passivi per categoria</h2>${byCat('passivo')}</div></div>
    <div class="card"><h2>Lo sapevi?</h2><ul class="c">${c.map(x => `<li>${x}</li>`).join('')}</ul>
    <p class="note">Informazioni generali a scopo educativo, non consulenza finanziaria.</p></div>`;
}

function pageAdm() {
  const u = S.users, pend = u.filter(x => !x.approved), ok = u.filter(x => x.approved);
  const row = (x, p) => `<div class="row"><div class="n">${esc(x.nome)}</div>
    ${p ? `<button class="b sm" data-act="appr" data-v="${x.uid}">Approva</button><button class="b r sm" data-act="rej" data-v="${x.uid}">Rifiuta</button>`
        : `<button class="b s sm" data-act="view" data-v="${x.uid}">Vedi dati</button><button class="b r sm" data-act="rev" data-v="${x.uid}">Revoca</button>`}</div>`;
  return `<div class="card"><h2>In attesa di approvazione (${pend.length})</h2>${pend.length ? pend.map(x => row(x, true)).join('') : '<p class="note">Nessuna richiesta.</p>'}</div>
    <div class="card"><h2>Utenti approvati (${ok.length})</h2>${ok.length ? ok.map(x => row(x, false)).join('') : '<p class="note">Nessun utente.</p>'}</div>
    <div class="card"><button class="b s" data-act="reload-users">Aggiorna elenco</button></div>`;
}

/* ---------- Azioni ---------- */
function exportCsv() {
  const D = S.data, n = v => String(v).replace('.', ',');
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  let out = 'Tipo;Categoria;Account;Nome;Valore;Conto;Obiettivo\n' + D.voci.map(v => [v.tipo, q(v.categoria), q(accName(v)), q(v.nome), n(v.valore), q(v.conto ? contoName(v) : ''), v.obiettivo ? n(v.obiettivo) : ''].join(';')).join('\n');
  out += '\n\nMese;Attivi;Passivi;Netto\n' + D.storico.map(s => [s.mese, n(s.attivi), n(s.passivi), n(s.netto)].join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + out], { type: 'text/csv;charset=utf-8' }));
  a.download = 'pfinance_' + D.nome.replace(/[^a-z0-9]/gi, '') + '_' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click(); URL.revokeObjectURL(a.href);
}

const FIDS = ['ft', 'fm', 'fa', 'fc', 'fn', 'fv', 'fk', 'fi', 'ff', 'fcn', 'fcm', 'fo'];
function grabForm() { const o = {}; FIDS.forEach(id => { const e = $(id); if (e) o[id] = e.value; }); return o; }

async function act(el) {
  const a = el.dataset.act, v = el.dataset.v, D = S.data;
  S.msg = '';
  try {
    if (a === 'mode') { S.mode = v; return render(); }
    if (a === 'login' || a === 'register') {
      const n = $('nm').value.trim(), p = $('pn').value.trim();
      if (mailOf(n).length < 14) { S.msg = 'Inserisci un nome valido.'; return render(); }
      if (!/^\d{6}$/.test(p)) { S.msg = 'Il PIN deve essere di 6 cifre.'; return render(); }
      if (a === 'register') { S.pendingName = n; await createUserWithEmailAndPassword(auth, mailOf(n), p); }
      else await signInWithEmailAndPassword(auth, mailOf(n), p);
      return;
    }
    if (a === 'logout') { S.tab = 'pat'; S.mode = 'login'; S.menu = false; S.pop = null; S.fAcc = 'all'; return signOut(auth); }
    if (a === 'refresh') return location.reload();
    if (a === 'tab') { S.tab = v; return render(); }
    if (a === 'facc') { S.fAcc = v; S.edit = null; S.menu = false; S.addAcc = false; return render(); }
    if (a === 'admin') { S.tab = 'adm'; S.menu = false; S.addAcc = false; return render(); }
    if (a === 'exp') { S.exp = S.exp || {}; S.exp[v] = !S.exp[v]; return render(); }
    if (a === 'menu') { S.menu = !S.menu; S.addAcc = false; return render(); }
    if (a === 'addo') { S.addAcc = true; render(); const i = $('an'); if (i) i.focus(); return; }
    if (a === 'addc') { S.addAcc = false; return render(); }
    if (a === 'pop') { S.pop = { id: v, mode: 'menu' }; return render(); }
    if (a === 'popclose') { S.pop = null; return render(); }
    if (a === 'popback') { S.pop.mode = 'menu'; return render(); }
    if (a === 'popupd') { S.pop.mode = 'upd'; return render(); }
    if (a === 'popdel') { S.pop.mode = 'del'; return render(); }
    if (a === 'popedit') { S.edit = S.pop.id; S.fd = null; S.pop = null; render(); const f = $('formvoce'); if (f) f.scrollIntoView({ behavior: 'smooth' }); return; }
    if (a === 'updsave') {
      const x = D.voci.find(z => z.id === S.pop.id), nv = pnum($('pv').value);
      if (!isFinite(nv) || nv < 0) { S.msg = 'Inserisci un valore valido (zero o più).'; return render(); }
      const { id: _i, ...rest } = x, dati = { ...rest, valore: r2(nv) };
      await setDoc(doc(db, 'users', D.uid, 'voci', x.id), dati); Object.assign(x, dati);
      await syncStorico(); S.pop = null; S.msg = 'Valore aggiornato.'; return render();
    }
    if (a === 'delok') {
      const id = S.pop.id;
      if (D.voci.some(z => z.conto === id)) { S.msg = 'Prima sposta o elimina i portafogli collegati a questo conto.'; return render(); }
      await deleteDoc(doc(db, 'users', D.uid, 'voci', id));
      D.voci = D.voci.filter(z => z.id !== id); await syncStorico(); S.pop = null; return render();
    }
    if (a === 'dview') { S.dview = v; return render(); }
    if (a === 'dmode') { S.dmode = el.value; return render(); }
    if (a === 'adda') {
      const nm = $('an').value.trim();
      if (!nm) { S.msg = 'Scrivi il nome dell\'account.'; return render(); }
      if (D.accounts.length >= 10) { S.msg = 'Massimo 10 account.'; return render(); }
      if ([D.nome, ...D.accounts.map(x => x.nome)].some(x => x.toLowerCase() === nm.toLowerCase())) { S.msg = 'Esiste già un account con questo nome.'; return render(); }
      const r = await addDoc(collection(db, 'users', D.uid, 'account'), { nome: nm });
      D.accounts.push({ id: r.id, nome: nm }); D.accounts.sort((x, y) => x.nome.localeCompare(y.nome)); S.addAcc = false; S.msg = 'Account aggiunto.'; return render();
    }
    if (a === 'rena') {
      const ac = D.accounts.find(x => x.id === v), nm = (prompt('Nuovo nome dell\'account', ac.nome) || '').trim();
      if (!nm || nm === ac.nome) return;
      if ([D.nome, ...D.accounts.filter(x => x.id !== v).map(x => x.nome)].some(x => x.toLowerCase() === nm.toLowerCase())) { S.msg = 'Esiste già un account con questo nome.'; return render(); }
      await setDoc(doc(db, 'users', D.uid, 'account', v), { nome: nm }); ac.nome = nm; D.accounts.sort((x, y) => x.nome.localeCompare(y.nome)); return render();
    }
    if (a === 'dela') {
      if (D.voci.some(x => x.account === v)) { S.msg = 'Prima sposta o elimina le voci di questo account.'; return render(); }
      if (!confirm('Eliminare questo account?')) return;
      await deleteDoc(doc(db, 'users', D.uid, 'account', v)); D.accounts = D.accounts.filter(x => x.id !== v);
      if (S.fAcc === v) S.fAcc = 'all'; return render();
    }
    if (a === 'range') { S.range = +el.value; return render(); }
    if (a === 'editm') { S.editM = v; S.draft = null; render(); return window.scrollTo(0, 0); }
    if (a === 'cancelm') { S.editM = null; return render(); }
    if (a === 'delm') {
      if (!confirm('Eliminare questo mese dallo storico?')) return;
      await deleteDoc(doc(db, 'users', D.uid, 'storico', v));
      D.storico = D.storico.filter(x => x.mese !== v); return render();
    }
    if (a === 'savem') {
      const mm = $('mm').value.trim(), at = pnum($('ma').value), pa = pnum($('mp').value);
      S.draft = S.editM ? null : { mm, ma: $('ma').value, mp: $('mp').value };
      if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(mm)) { S.msg = 'Inserisci il mese nel formato AAAA-MM (es. 2026-03).'; return render(); }
      if (mm >= monthKey()) { S.msg = 'Puoi inserire solo mesi passati: il mese in corso si aggiorna da solo.'; return render(); }
      if (!isFinite(at) || !isFinite(pa) || at < 0 || pa < 0) { S.msg = 'Inserisci attivi e passivi validi (zero o più).'; return render(); }
      const dati = { attivi: r2(at), passivi: r2(pa), netto: r2(at - pa) };
      await setDoc(doc(db, 'users', D.uid, 'storico', mm), { ...dati, manuale: true, aggiornato: serverTimestamp() });
      const ex = D.storico.find(x => x.mese === mm);
      if (ex) Object.assign(ex, dati, { manuale: true }); else { D.storico.push({ mese: mm, ...dati, manuale: true }); D.storico.sort((x, y) => x.mese.localeCompare(y.mese)); }
      S.editM = null; S.draft = null; S.msg = 'Mese salvato.'; return render();
    }
    if (a === 'share') {
      const url = location.href.split('#')[0];
      const data = { title: 'P.Finance', text: 'Prova P.Finance: monitora il tuo patrimonio.', url };
      if (navigator.share) { try { await navigator.share(data); } catch (_) {} return; }
      try { await navigator.clipboard.writeText(url); S.msg = 'Link copiato negli appunti.'; } catch (_) { S.msg = 'Link: ' + url; }
      return render();
    }
    if (a === 'ftipo' || a === 'fmod' || a === 'fcat') { S.fd = grabForm(); return render(); }
    if (a === 'edit') { S.edit = v; return render(); }
    if (a === 'cancel') { S.edit = null; S.fd = null; return render(); }
    if (a === 'export') return exportCsv();
    if (a === 'save') {
      S.fd = grabForm();
      const tipo = $('ft').value, categoria = $('fc').value, nome = $('fn').value.trim(), fm = $('fm'), fa2 = $('fa');
      const base = { tipo, categoria, nome, account: fa2 && fa2.value !== 'main' ? fa2.value : '' };
      let dati;
      if (tipo === 'passivo' && fm && fm.value === 'piano') {
        const cap = pnum($('fk').value), ini = $('fi').value, fin = $('ff').value;
        if (!nome || !isFinite(cap) || cap <= 0) { S.msg = 'Inserisci un nome e l\'importo preso a prestito.'; return render(); }
        if (!ini || !fin || fin <= ini) { S.msg = 'Inserisci le date: la fine deve essere dopo l\'inizio.'; return render(); }
        dati = applyPiano({ ...base, piano: true, capitale: r2(cap), inizio: ini, fine: fin, valore: 0 });
      } else {
        const valore = pnum($('fv').value);
        if (!nome || !isFinite(valore) || valore < 0) { S.msg = 'Inserisci un nome e un valore valido (zero o più).'; return render(); }
        dati = { ...base, valore: r2(valore) };
        if (tipo === 'attivo' && categoria === 'Portafoglio') {
          const cn = $('fcn') ? $('fcn').value : 'new', ob = $('fo') ? pnum($('fo').value) : NaN;
          if (cn === 'new') {
            const nc = ($('fcm') ? $('fcm').value : '').trim();
            if (!nc) { S.msg = 'Scrivi il nome del nuovo conto.'; return render(); }
            const nuovo = { tipo: 'attivo', categoria: 'Conto di investimento', nome: nc, account: base.account, valore: 0 };
            const r0 = await addDoc(collection(db, 'users', D.uid, 'voci'), nuovo);
            D.voci.push({ id: r0.id, ...nuovo }); dati.conto = r0.id;
          } else {
            const c = D.voci.find(x => x.id === cn);
            dati.conto = cn; dati.account = c ? (c.account || '') : base.account;
          }
          if (isFinite(ob) && ob > 0) dati.obiettivo = r2(ob);
        }
      }
      if (S.edit) { await setDoc(doc(db, 'users', D.uid, 'voci', S.edit), dati); const i = D.voci.findIndex(x => x.id === S.edit); D.voci[i] = { id: S.edit, ...dati }; }
      else { const r = await addDoc(collection(db, 'users', D.uid, 'voci'), dati); D.voci.push({ id: r.id, ...dati }); }
      S.edit = null; S.fd = null; await syncStorico(); return render();
    }
    if (a === 'del') {
      if (!confirm('Eliminare questa voce?')) return;
      await deleteDoc(doc(db, 'users', D.uid, 'voci', v));
      D.voci = D.voci.filter(x => x.id !== v); await syncStorico(); return render();
    }
    if (a === 'appr' || a === 'rev') { await updateDoc(doc(db, 'users', v), { approved: a === 'appr' }); await loadUsers(); return render(); }
    if (a === 'rej') { if (!confirm('Rifiutare questa richiesta?')) return; await deleteDoc(doc(db, 'users', v)); await loadUsers(); return render(); }
    if (a === 'reload-users') { await loadUsers(); return render(); }
    if (a === 'view') {
      const u = S.users.find(x => x.uid === v);
      S.own = S.data; await loadData(v, u.nome, true); S.fAcc = 'all'; S.menu = false; S.tab = 'pat'; return render();
    }
    if (a === 'back') { S.data = S.own; S.fAcc = 'all'; S.tab = 'adm'; return render(); }
  } catch (e) { S.msg = errText(e); render(); }
}

document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && el.tagName !== 'SELECT') act(el); });
document.addEventListener('change', e => { if (e.target.tagName === 'SELECT' && e.target.dataset.act) act(e.target); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if ($('pn') && document.activeElement === $('pn')) act(document.querySelector('[data-act="login"],[data-act="register"]'));
  else if ($('an') && document.activeElement === $('an')) act(document.querySelector('[data-act="adda"]'));
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
